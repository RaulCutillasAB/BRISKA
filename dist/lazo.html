<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#071a1a">
<title>Lazo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #f4f1ff; --muted: #a9a6c8; --gold: #ffd76a; --pink: #ff8ac8; --sky: #8fd8ff; --mint: #9cffc8; --red: #ff6a8a;
  --panel: rgba(16, 14, 38, .82); --panel2: rgba(30, 26, 64, .86); --line: rgba(255, 255, 255, .12); --glow: rgba(255, 215, 106, .35);
  --r: 18px; --ease: cubic-bezier(.2, .9, .25, 1.15);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #050812; color: var(--ink); font-family: 'Fredoka', system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
canvas#cv { position: fixed; inset: 0; display: block; }
button { font-family: inherit; color: inherit; }
.hidden { display: none !important; }
.ico { display: block; width: 100%; height: 100%; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left)); display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; }
#hud-left { display: flex; flex-direction: column; gap: 8px; }
#hearts { display: flex; gap: 4px; flex-wrap: wrap; max-width: 260px; }
.hrt { width: 28px; height: 28px; color: var(--red); filter: drop-shadow(0 0 6px rgba(255, 90, 130, .7)); transition: transform .2s var(--ease); }
.hrt.empty { color: rgba(255, 255, 255, .18); filter: none; }
.hrt.shield { color: #ffb0e0; }
.hrt.pop { animation: hpop .4s var(--ease); }
@keyframes hpop { 40% { transform: scale(1.5) rotate(-10deg); } }
#dash { position: relative; width: 112px; height: 14px; border-radius: 8px; background: rgba(255, 255, 255, .08); overflow: hidden; border: 1px solid var(--line); }
#dash-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #8fd8ff, #fff); border-radius: 8px; }
#dash span { position: absolute; inset: 0; font-size: 10px; text-align: center; line-height: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #0b1430; mix-blend-mode: normal; opacity: .7; }
#dash.ready #dash-fill { box-shadow: 0 0 12px #8fd8ff; }
#hud-center { position: absolute; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; width: min(460px, 60vw); }
#room-label { font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-align: center; text-shadow: 0 2px 6px rgba(0, 0, 0, .6); }
#bossbar { width: 100%; text-align: center; }
#boss-name { font-weight: 700; font-size: 17px; color: #ffd0e6; text-shadow: 0 0 12px rgba(255, 90, 160, .7); margin-bottom: 4px; }
.bb { height: 12px; border-radius: 8px; background: rgba(0, 0, 0, .45); border: 1px solid rgba(255, 150, 200, .4); overflow: hidden; }
#boss-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff5aa0, #ffb36a); transition: width .25s; box-shadow: 0 0 14px #ff5aa0; }
#hud-right { display: flex; gap: 10px; align-items: center; pointer-events: auto; }
#polen { display: flex; align-items: center; gap: 8px; background: rgba(0, 0, 0, .35); padding: 6px 14px 6px 10px; border-radius: 20px; border: 1px solid rgba(255, 215, 106, .3); font-size: 20px; }
#polen b { color: var(--gold); text-shadow: 0 0 10px rgba(255, 200, 80, .6); min-width: 30px; }
.pdot { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle, #fff6c8, #ffc850 50%, rgba(255, 190, 60, 0) 72%); box-shadow: 0 0 10px #ffc850; display: inline-block; }
#polen.bump b { animation: hpop .3s; display: inline-block; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: rgba(0, 0, 0, .35); padding: 9px; cursor: pointer; color: var(--ink); }
.iconbtn:hover { background: rgba(255, 255, 255, .12); }
#touch-dash { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom)); width: 78px; height: 78px; border-radius: 50%; border: 2px solid rgba(143, 216, 255, .6); background: radial-gradient(circle at 40% 35%, rgba(143, 216, 255, .35), rgba(20, 30, 60, .55)); z-index: 12; color: #dff4ff; padding: 18px; font-weight: 700; }
#touch-dash.cd { opacity: .4; }
#hint { position: fixed; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 11; pointer-events: none; text-align: center; font-size: 18px; font-weight: 500; color: #fff; text-shadow: 0 2px 8px rgba(0, 0, 0, .8); opacity: 0; transition: opacity .5s; max-width: 90vw; }
#hint.show { opacity: 1; }
#hint small { display: block; font-size: 14px; color: var(--muted); }

/* ---------- pantallas ---------- */
#screen { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); overflow-y: auto; }
#screen.show { display: flex; animation: fade .35s; }
#screen.dim { background: rgba(4, 6, 16, .62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
@keyframes fade { from { opacity: 0; } }
.box { width: min(760px, 100%); margin: auto; background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 26px; padding: 26px; box-shadow: 0 30px 80px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .08); animation: rise .5s var(--ease); position: relative; }
@keyframes rise { from { transform: translateY(40px) scale(.96); opacity: 0; } }
h1, h2, h3 { margin: 0; font-weight: 700; }
.box h2 { text-align: center; font-size: 30px; }
.sub { text-align: center; color: var(--muted); margin: 6px 0 18px; font-size: 16px; }
.row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.btn { appearance: none; border: 0; cursor: pointer; font-weight: 600; font-size: 18px; padding: 14px 26px; border-radius: 16px; color: #1a1030; background: linear-gradient(180deg, #ffe7a0, #ffc24a); box-shadow: 0 5px 0 #b97c1c, 0 10px 24px rgba(255, 190, 70, .25); transition: transform .08s, filter .15s, box-shadow .08s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b97c1c; }
.btn.alt { color: var(--ink); background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .07)); box-shadow: 0 5px 0 rgba(0, 0, 0, .35); border: 1px solid var(--line); }
.btn.pink { background: linear-gradient(180deg, #ffb6e0, #ff6aa8); box-shadow: 0 5px 0 #a8306a, 0 10px 24px rgba(255, 100, 170, .25); }
.btn.sky { background: linear-gradient(180deg, #c8f0ff, #6ac8ff); box-shadow: 0 5px 0 #2a6aa8, 0 10px 24px rgba(100, 190, 255, .25); }
.btn.small { font-size: 15px; padding: 10px 18px; border-radius: 12px; }
.btn:disabled { opacity: .4; cursor: default; filter: grayscale(.5); transform: none; }
.btn .c { display: inline-flex; align-items: center; gap: 6px; }

/* menú */
.menu { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; animation: fade 1s; }
.title { font-size: clamp(76px, 17vw, 168px); font-weight: 700; line-height: .9; letter-spacing: .02em; background: linear-gradient(180deg, #fffbe6 10%, #ffe08a 45%, #ff9ac8 90%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 30px rgba(255, 210, 120, .45)) drop-shadow(0 6px 0 rgba(60, 20, 60, .5)); animation: float 5s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-8px); } }
.tagline { font-size: clamp(16px, 2.5vw, 22px); color: #d8d4f4; margin-top: -4px; }
.menu .btns { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; width: min(320px, 82vw); }
.menu .btns .btn { width: 100%; }
.foot { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 12px; color: rgba(220, 215, 255, .4); pointer-events: none; }

/* luciérnagas */
.chars { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
.char { border-radius: 18px; border: 2px solid var(--line); background: rgba(255, 255, 255, .04); padding: 14px 10px; text-align: center; cursor: pointer; transition: transform .2s var(--ease), border-color .2s; position: relative; }
.char:hover { transform: translateY(-4px); }
.char.on { border-color: var(--cc); box-shadow: 0 0 24px color-mix(in srgb, var(--cc) 40%, transparent); }
.char.locked { opacity: .45; cursor: not-allowed; }
.char .fly { width: 64px; height: 64px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, color-mix(in srgb, var(--cc) 75%, white) 0%, var(--cc) 30%, transparent 70%); color: #1a1030; padding: 10px; animation: float 3s ease-in-out infinite; }
.char.locked .fly { background: rgba(255, 255, 255, .08); color: var(--muted); }
.char b { font-size: 18px; display: block; }
.chardesc { margin-top: 14px; text-align: center; min-height: 48px; color: #e8e4ff; font-size: 16px; }
.moons { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.moon { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; background: radial-gradient(circle at 35% 35%, #fffbe6, #c8c0e8 60%, #6a6488); position: relative; overflow: hidden; }
.moon::after { content: ''; position: absolute; inset: 0; background: #0b0a22; border-radius: 50%; transform: translateX(var(--mx)); }
.moon.on { border-color: var(--gold); box-shadow: 0 0 16px var(--glow); }
.moon.locked { opacity: .3; cursor: not-allowed; }
.moondesc { text-align: center; color: var(--muted); margin-top: 8px; min-height: 22px; }

/* mapa */
.mapwrap { width: min(560px, 100%); margin: auto; display: flex; flex-direction: column; gap: 10px; }
.maphead { text-align: center; }
.maphead h2 { font-size: 28px; }
.maphead .sub { margin: 2px 0 0; }
.mapsvg { width: 100%; height: auto; max-height: calc(100vh - 230px); max-height: calc(100dvh - 230px); display: block; margin: 0 auto; }
.mapnode { cursor: pointer; }
.mapnode .halo { opacity: 0; }
.mapnode.avail .halo { opacity: 1; animation: pulse 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes pulse { 50% { transform: scale(1.25); opacity: .4; } }
.mapnode.dimmed { opacity: .35; cursor: default; }
.mapnode.done { opacity: .55; cursor: default; }
.runbar { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; background: rgba(0, 0, 0, .3); border: 1px solid var(--line); border-radius: 16px; padding: 8px 12px; }
.runbar .hs { display: flex; gap: 2px; }
.runbar .hs .hrt { width: 20px; height: 20px; }
.donrow { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.dmini { width: 30px; height: 30px; border-radius: 9px; padding: 5px; background: rgba(255, 255, 255, .07); border: 1px solid var(--rc, var(--line)); color: var(--rc); position: relative; cursor: help; }
.dmini i { position: absolute; right: -4px; bottom: -4px; font-style: normal; font-size: 10px; background: #000; border-radius: 6px; padding: 0 3px; color: #fff; }

/* cartas de don */
.cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.card { width: 200px; min-height: 260px; border-radius: 22px; padding: 18px 16px; text-align: center; cursor: pointer; position: relative; background: linear-gradient(180deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .03)); border: 2px solid var(--rc); box-shadow: 0 0 0 1px rgba(0, 0, 0, .3), 0 14px 30px rgba(0, 0, 0, .4), inset 0 0 40px color-mix(in srgb, var(--rc) 15%, transparent); transition: transform .25s var(--ease), box-shadow .25s; animation: dealin .5s var(--ease) backwards; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.card:nth-child(2) { animation-delay: .08s; } .card:nth-child(3) { animation-delay: .16s; } .card:nth-child(4) { animation-delay: .24s; }
@keyframes dealin { from { transform: translateY(60px) rotate(-6deg); opacity: 0; } }
.card:hover { transform: translateY(-8px) scale(1.03); box-shadow: 0 0 30px color-mix(in srgb, var(--rc) 50%, transparent), 0 20px 40px rgba(0, 0, 0, .5); }
.card .ic { width: 82px; height: 82px; border-radius: 50%; padding: 18px; color: #fff; background: radial-gradient(circle, color-mix(in srgb, var(--rc) 60%, transparent), transparent 70%); filter: drop-shadow(0 0 10px var(--rc)); }
.card h3 { font-size: 20px; }
.card .rar { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--rc); font-weight: 600; }
.card p { margin: 0; font-size: 15px; color: #e4e0fa; line-height: 1.35; }
.card .own { position: absolute; top: 10px; right: 12px; font-size: 12px; color: var(--muted); }
.card .price { margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 18px; font-weight: 700; color: var(--gold); background: rgba(0, 0, 0, .35); padding: 4px 12px; border-radius: 12px; }
.card.cant { opacity: .5; }
.card.sold { opacity: .25; pointer-events: none; }

/* evento */
.event .eic { width: 96px; height: 96px; margin: 0 auto 10px; color: #e8d8ff; padding: 18px; border-radius: 50%; background: radial-gradient(circle, rgba(200, 160, 255, .35), transparent 70%); }
.event p.txt { text-align: center; font-size: 18px; line-height: 1.45; color: #ece8ff; margin: 8px auto 18px; max-width: 520px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; border-radius: 16px; padding: 14px 16px; cursor: pointer; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); transition: background .2s, transform .15s; }
.opt:hover { background: rgba(255, 255, 255, .12); transform: translateX(4px); }
.opt b { font-size: 18px; }
.opt span { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.opt.no { opacity: .4; pointer-events: none; }

/* fin */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
.stat { background: rgba(0, 0, 0, .3); border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; }
.stat b { display: block; font-size: 24px; color: var(--gold); }
.stat span { font-size: 13px; color: var(--muted); }

/* códice */
.tabs { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
.tab { padding: 8px 14px; border-radius: 12px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); cursor: pointer; font-weight: 600; color: var(--muted); }
.tab.on { background: var(--gold); color: #1a1030; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-height: 60vh; overflow: auto; padding: 4px; }
.gi { border-radius: 14px; padding: 10px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); display: flex; gap: 10px; align-items: center; font-size: 14px; }
.gi .gic { width: 38px; height: 38px; flex: none; color: var(--rc, var(--ink)); padding: 6px; border-radius: 10px; background: rgba(255, 255, 255, .06); }
.gi.unk { opacity: .35; }
.gi small { display: block; color: var(--muted); font-size: 12px; line-height: 1.25; }
.optrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
.seg { display: flex; gap: 4px; }
.seg button { border: 1px solid var(--line); background: rgba(255, 255, 255, .06); padding: 6px 12px; border-radius: 10px; cursor: pointer; font-weight: 600; }
.seg button.on { background: var(--gold); color: #1a1030; }
input[type=range] { accent-color: var(--gold); width: 160px; }
.howto p { font-size: 17px; line-height: 1.5; color: #ece8ff; }
.howto .demo { display: flex; justify-content: center; margin: 8px 0; }

#tip { position: fixed; z-index: 40; pointer-events: none; max-width: 260px; background: rgba(14, 12, 34, .96); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; opacity: 0; transition: opacity .12s; }
#tip.show { opacity: 1; }
#tip b { display: block; font-size: 16px; margin-bottom: 2px; }
#toasts { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: rgba(20, 16, 44, .95); border: 1px solid rgba(255, 215, 106, .5); color: var(--gold); padding: 10px 18px; border-radius: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 0 24px rgba(255, 215, 106, .25); animation: toast 3.4s var(--ease) forwards; text-align: center; }
@keyframes toast { 0% { transform: translateY(-20px); opacity: 0; } 10% { transform: none; opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
.big-banner { position: fixed; left: 0; right: 0; top: 38%; text-align: center; z-index: 15; pointer-events: none; animation: banner 2.2s var(--ease) forwards; }
.big-banner b { font-size: clamp(36px, 7vw, 72px); display: block; color: #fff; text-shadow: 0 0 30px var(--bc, #ffd76a), 0 4px 0 rgba(0, 0, 0, .4); }
.big-banner span { font-size: clamp(16px, 2.4vw, 22px); color: #e8e4ff; text-shadow: 0 2px 8px #000; }
@keyframes banner { 0% { transform: scale(.6); opacity: 0; } 15% { transform: scale(1.06); opacity: 1; } 25% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }

@media (max-width: 640px) {
  .box { padding: 18px 14px; border-radius: 20px; }
  .box h2 { font-size: 24px; }
  .card { width: 100%; min-height: 0; flex-direction: row; text-align: left; padding: 12px; gap: 12px; }
  .card .ic { width: 60px; height: 60px; padding: 12px; flex: none; }
  .card .txt { flex: 1; }
  .card .price { margin-top: 6px; }
  .hrt { width: 22px; height: 22px; }
  #room-label { font-size: 12px; }
  #polen { font-size: 16px; padding: 4px 10px 4px 8px; }
  .iconbtn { width: 34px; height: 34px; padding: 7px; }
  #hint { bottom: 120px; font-size: 16px; }
  #hud-center { top: max(14px, env(safe-area-inset-top)); width: 40vw; }
}
@media (prefers-reduced-motion: reduce) { .title, .char .fly { animation: none; } }

</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden">
  <div id="hud-left"><div id="hearts"></div><div id="dash"><div id="dash-fill"></div><span>Impulso</span></div></div>
  <div id="hud-center"><div id="room-label"></div><div id="bossbar" class="hidden"><div id="boss-name"></div><div class="bb"><div id="boss-fill"></div></div></div></div>
  <div id="hud-right"><div id="polen"><span class="pdot"></span><b id="polen-v">0</b></div><button id="btn-pause" class="iconbtn" aria-label="Pausa"></button></div>
</div>
<div id="hint"></div>
<button id="touch-dash" class="hidden" aria-label="Impulso"></button>
<div id="screen"></div>
<div id="tip"></div>
<div id="toasts"></div>
<script>
/* LAZO — utilidades: azar con semilla, matemáticas y geometría */
(function (L) {
  'use strict';
  class RNG {
    constructor(seed) { this.s = (seed >>> 0) || 1; }
    next() { let t = (this.s = (this.s + 0x6d2b79f5) >>> 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
    range(a, b) { return a + this.next() * (b - a); }
    int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
    pick(a) { return a[Math.floor(this.next() * a.length)]; }
    chance(p) { return this.next() < p; }
    shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(this.next() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    weighted(list, w) { let t = 0; for (const x of list) t += w(x); let r = this.next() * t; for (const x of list) { r -= w(x); if (r <= 0) return x; } return list[list.length - 1]; }
  }
  L.RNG = RNG;
  L.hash = (str) => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  L.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  L.lerp = (a, b, t) => a + (b - a) * t;
  L.dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
  L.ease = (t) => 1 - Math.pow(1 - t, 3);

  // intersección de segmentos p1p2 y p3p4; devuelve {x,y,t,u} o null
  L.segX = function (x1, y1, x2, y2, x3, y3, x4, y4) {
    const d = (x2 - x1) * (y4 - y3) - (y2 - y1) * (x4 - x3);
    if (Math.abs(d) < 1e-9) return null;
    const t = ((x3 - x1) * (y4 - y3) - (y3 - y1) * (x4 - x3)) / d;
    const u = ((x3 - x1) * (y2 - y1) - (y3 - y1) * (x2 - x1)) / d;
    if (t < 0 || t > 1 || u < 0 || u > 1) return null;
    return { x: x1 + t * (x2 - x1), y: y1 + t * (y2 - y1), t, u };
  };
  L.inPoly = function (x, y, poly) {
    let ins = false;

          if (n > this.stats.bestCombo) this.stats.bestCombo = n;
          const gain = n * 10 * n;
          this.stats.score += gain;
          if (n >= 2) this.text(c.x, c.y - 10, n >= 6 ? '¡LAZO ×' + n + '!' : n >= 4 ? '¡Lazo ×' + n + '!' : 'Lazo ×' + n, n >= 6 ? '#ffd36e' : n >= 4 ? '#ffb0e0' : '#bfefff', n >= 4 ? 1.6 : 1.2);
          this.ach('primer'); if (n >= 3) this.ach('triple'); if (n >= 6) this.ach('seis'); if (n >= 10) this.ach('diez');
        }

      }

    }
    updateEchoes(dt) {
      for (const e of this.echoes) {
        e.t -= dt;
        if (e.t <= 0 && !e.done) {
          e.done = true;
          this.applyLoop(e.poly, e.area, { echo: true, solar: e.solar });
          if (this.has('twin')) this.applyLoop(this.mirror(e.poly), e.area, { echo: true });

    }
    cutTrail(x, y) {
      if (this.has('uncut')) return false;
      const T = this.trail;
      for (let i = T.length - 2; i >= 1; i--) {
        if (L.segDist(x, y, T[i - 1].x, T[i - 1].y, T[i].x, T[i].y) < 10) {
          const removed = T.slice(0, i);
          this.trail = T.slice(i);
          let l = 0; for (let k = 1; k < this.trail.length; k++) l += L.dist(this.trail[k - 1].x, this.trail[k - 1].y, this.trail[k].x, this.trail[k].y);
          this.trailLenNow = l;
          for (let k = 0; k < removed.length; k += 2) this.parts.push({ x: removed[k].x, y: removed[k].y, vx: this.rng.range(-40, 40), vy: this.rng.range(-40, 40), life: 0.6, t: 0, c: '#ff8a8a', s: 2 });
          this.events.push({ t: 'cut' });
          return true;
        }
      }
      return false;
    }

    /* ---------------- daño ---------------- */
    damage(e, d, how) {
      if (e.spawn > 0 || e.dead) return;
      e.hp -= d;
      e.flash = 0.16;
      this.text(e.x + this.rng.range(-8, 8), e.y - e.r - 6, '' + d, how === 'loop' ? '#ffffff' : '#ffd0a0', 0.8, true);
      if (e.hp <= 0) this.kill(e, how);
      else if (!e.boss) { const dd = Math.max(1, L.dist(e.x, e.y, this.p.x, this.p.y)); e.kx += ((e.x - this.p.x) / dd) * 120; e.ky += ((e.y - this.p.y) / dd) * 120; }
    }
    kill(e, how) {
      if (e.dead) return;
      e.dead = true;
      this.stats.kills++;
      this.lastKillT = this.roomT;
      this.stats.score += e.boss ? 1000 : e.elite ? 60 : 15;
      const E = L.ENEMIES[e.t];
      this.burst(e.x, e.y, e.boss ? 80 : e.elite ? 30 : 16, E.eye, e.boss ? 420 : 260, 0.7, e.boss ? 4 : 2.5);
      this.burst(e.x, e.y, 8, '#ffffff', 160, 0.4, 2);
      this.events.push({ t: 'kill', boss: e.boss, elite: e.elite });
      let pv = E.polen * (e.elite ? 3 : 1);
      if (pv) this.dropPolen(e.x, e.y, pv);
      if (e.elite && this.rng.chance(0.5)) this.pickups.push({ x: e.x, y: e.y, vx: 0, vy: -60, type: 'heart', v: 1, t: 0 });
      else if (!e.boss && this.rng.chance(0.018)) this.pickups.push({ x: e.x, y: e.y, vx: 0, vy: -60, type: 'heart', v: 1, t: 0 });
      if (e.t === 'gemelo') for (let i = 0; i < 2; i++) { const n = this.spawnEnemy('sombra', e.x + (i ? 14 : -14), e.y, { delay: 0 }); n.r *= 0.8; n.kx = (i ? 1 : -1) * 220; }
      if (e.t === 'bombilla') this.explode(e.x, e.y, 135, 2, false);
      if (how === 'loop' && this.has('nova') && !e.boss) this.shockwave(e.x, e.y, 95, 1, '#ff9ae0');
      if (e.boss) this.bossDown(e);
    }
    explode(x, y, r, d, hurtsPlayer) {
      this.shockwave(x, y, r, d, '#ffcc4a');
      this.shake = Math.max(this.shake, 8);
      if (hurtsPlayer && L.dist(x, y, this.p.x, this.p.y) < r * 0.7) this.hurt();
      this.events.push({ t: 'boom' });
    }
    shockwave(x, y, r, d, color) {
      this.rings.push({ x, y, r, t: 0, life: 0.45, c: color });
      for (const e of this.enemies.slice()) if (!e.dead && e.spawn <= 0 && L.dist(e.x, e.y, x, y) < r + e.r * 0.5) { if (e.boss) continue; this.damage(e, d, 'wave'); }
    }
    ring(x, y, c, r, inward) { this.rings.push({ x, y, r, t: 0, life: 0.5, c, inward }); }
    hurt() {
      const p = this.p;
      if (p.inv > 0 || p.dashT > 0 || this.cleared) return;
      if (p.shield > 0) { p.shield = 0; p.inv = 0.8; this.ring(p.x, p.y, '#ffb0e0', 90); this.events.push({ t: 'shield' }); return; }
      p.hearts -= 1;
      this.stats.hurt++; this.roomHurt++;
      const veil = this.has('veil');
      p.inv = p.st.inv * (veil ? 2 : 1);
      if (veil) this.slowT = 3;
      this.shake = 14; this.hitstop = 0.12;
      this.burst(p.x, p.y, 26, '#ff6a8a', 300, 0.6, 3);
      this.events.push({ t: 'hurt' });
      // empuje a las sombras cercanas
      for (const e of this.enemies) { const d = L.dist(e.x, e.y, p.x, p.y); if (d < 160 && !e.boss) { e.kx += ((e.x - p.x) / (d || 1)) * 500; e.ky += ((e.y - p.y) / (d || 1)) * 500; } }
      this.bullets = this.bullets.filter((b) => L.dist(b.x, b.y, p.x, p.y) > 120);
      if (p.hearts <= 0) {
        if (p.revive > 0) {
          p.revive = 0; p.hearts = 2; p.inv = 2.5;
          this.dones = this.dones.filter((d) => d.id !== 'fenix');
          this.shockwave(p.x, p.y, 260, 3, '#ff9a3a');
          this.text(p.x, p.y - 40, '¡Renaces!', '#ffb36a', 1.6);
          this.events.push({ t: 'revive' });
        } else {
          this.phase = 'dead';
          this.events.push({ t: 'dead' });
        }
      }
    }
    clearRoom() {
      if (this.cleared) return;
      this.cleared = true; this.clearT = 0; this.doneEmitted = false;
      this.stats.rooms++;
      this.bullets = [];
      for (const k of this.pickups) k.pull = true;
      for (const d of this.dones) { const D = L.DON[d.id]; if (D.onClear) D.onClear(this); }
      if (this.roomType === 'elite' && this.roomHurt === 0) this.ach('intacta');
      this.events.push({ t: 'clear' });
    }
    bossDown(e) {
      this.enemies.forEach((x) => { if (x !== e && !x.dead) { x.dead = true; this.burst(x.x, x.y, 12, '#ffffff', 200, 0.5, 2); } });
      this.bullets = [];
      this.hitstop = 0.35; this.shake = 22;
      this.slowT = 0;
      if (this.floor === 0) this.ach('jefe1');
      if (this.floor === 1) this.ach('jefe2');
      this.clearRoom();
      this.events.push({ t: 'bossDown' });
    }
    dropPolen(x, y, v) {
      v = Math.round(v * this.p.st.polenMul);
      while (v > 0) {
        const piece = v >= 10 ? 5 : v >= 4 ? 2 : 1;
        v -= piece;
        const a = this.rng.range(0, TAU), s = this.rng.range(60, 200);
        this.pickups.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, type: 'polen', v: piece, t: 0 });
      }
    }

    /* ---------------- sombras ---------------- */
    updateEnemies(dt, rdt) {
      const p = this.p;
      const toP = (e) => { const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1; return { dx: dx / d, dy: dy / d, d }; };
      for (const e of this.enemies) {
        if (e.dead) continue;
        e.flash = Math.max(0, e.flash - rdt);
        e.ihit = Math.max(0, e.ihit - rdt);
        if (e.spawn > 0) { e.spawn -= rdt; continue; }
        e.age += dt;
        e.kx *= Math.pow(0.02, rdt); e.ky *= Math.pow(0.02, rdt);
        if (e.frozen > 0) { e.frozen -= rdt; e.x += e.kx * rdt; e.y += e.ky * rdt; this.clampE(e); continue; }
        let vx = 0, vy = 0;
        const t = toP(e);
        if (e.tired && !e.boss) { vx = t.dx * 40; vy = t.dy * 40; e.vx = vx; e.vy = vy; e.x += (vx + e.kx) * dt; e.y += (vy + e.ky) * dt; this.clampE(e); if (L.dist(e.x, e.y, p.x, p.y) < e.r * 0.8 + p.r * 0.5) this.hurt(); continue; }
        switch (e.t) {
          case 'sombra': case 'caparazon': case 'gemelo': vx = t.dx * e.speed; vy = t.dy * e.speed; break;
          case 'polilla': { const s = Math.sin(e.age * 4 + e.ph) * 0.7; vx = (t.dx - t.dy * s) * e.speed; vy = (t.dy + t.dx * s) * e.speed; break; }
          case 'enjambre': vx = (t.dx + Math.sin(e.age * 9 + e.ph) * 0.5) * e.speed; vy = (t.dy + Math.cos(e.age * 8 + e.ph) * 0.5) * e.speed; break;
          case 'bombilla': vx = t.dx * e.speed; vy = t.dy * e.speed; break;
          case 'saltarin': {
            e.timer -= dt;
            if (e.st === 0 && e.timer <= 0) { e.st = 1; e.timer = 0.38; e.jx = t.dx; e.jy = t.dy; }
            else if (e.st === 1) { vx = e.jx * 430; vy = e.jy * 430; if (e.timer <= 0) { e.st = 0; e.timer = this.rng.range(0.9, 1.5); } }
            else { vx = t.dx * 12; vy = t.dy * 12; }
            break;
          }
          case 'escupidor': {
            const want = t.d < 220 ? -1 : t.d > 320 ? 1 : 0;
            vx = t.dx * e.speed * want + Math.cos(e.age + e.ph) * 30; vy = t.dy * e.speed * want + Math.sin(e.age + e.ph) * 30;
            e.timer -= dt;
            if (e.timer <= 0.5 && !e.tell) e.tell = true;
            if (e.timer <= 0) { e.timer = 2.6; e.tell = false; this.shoot(e.x, e.y, Math.atan2(t.dy, t.dx), 200, e.elite ? 3 : 1, 0.22); }
            break;
          }
          case 'tijereta': {
            const T = this.trail;
            if (t.d < 150) { vx = -t.dx * e.speed; vy = -t.dy * e.speed; }
            else if (T.length > 6) {
              const q = T[Math.floor(T.length * 0.45)];
              const dx = q.x - e.x, dy = q.y - e.y, d = Math.hypot(dx, dy) || 1;
              vx = (dx / d) * e.speed; vy = (dy / d) * e.speed;
            } else { vx = Math.cos(e.age * 0.7 + e.ph) * e.speed * 0.5; vy = Math.sin(e.age * 0.9 + e.ph) * e.speed * 0.5; }
            e.timer -= dt;
            if (e.timer <= 0 && this.cutTrail(e.x, e.y)) { e.timer = 0.8; this.text(e.x, e.y - 20, '¡zas!', '#ff9a8a', 0.8); }
            break;
          }
          case 'centinela': {
            e.ang = (e.ang == null ? Math.atan2(e.y - p.y, e.x - p.x) : e.ang) + dt * 0.7;
            const tx = p.x + Math.cos(e.ang) * 230, ty = p.y + Math.sin(e.ang) * 230;
            const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy) || 1;
            vx = (dx / d) * Math.min(e.speed * 1.4, d * 3); vy = (dy / d) * Math.min(e.speed * 1.4, d * 3);
            e.timer -= dt;
            if (e.timer <= 0.6) e.tell = true;
            if (e.timer <= 0) { e.timer = 3.6; e.tell = false; this.ringShot(e.x, e.y, 8, 150, e.age); }
            break;
          }
          case 'madre': this.bossMadre(e, dt, t, (a, b) => { vx = a; vy = b; }); break;
          case 'ojo': this.bossOjo(e, dt, t, (a, b) => { vx = a; vy = b; }); break;
          case 'reina': this.bossReina(e, dt, t, (a, b) => { vx = a; vy = b; }); break;
        }
        e.vx = vx; e.vy = vy;
        e.x += (vx + e.kx) * dt; e.y += (vy + e.ky) * dt;
        this.clampE(e);
        // contacto con la luciérnaga
        const pd = L.dist(e.x, e.y, p.x, p.y);
        if (pd < e.r * 0.8 + p.r * 0.5) {
          if (p.dashT > 0 && !e.boss) {
            if (this.has('comet') && e.hp <= 1) { this.kill(e, 'dash'); continue; }
            if (this.has('thorns') && !e.dashHit) { e.dashHit = 1; this.damage(e, 2, 'dash'); }
          } else if (e.t === 'bombilla') { this.kill(e, 'touch'); this.explode(e.x, e.y, 100, 0, true); this.hurt(); }
          else this.hurt();
        }
        // estela ardiente
        if (this.has('burn') && !e.boss) {
          e.burnT -= rdt;
          if (e.burnT <= 0 && this.touchesTrail(e)) { e.burnT = 0.6; this.damage(e, 1, 'burn'); this.burst(e.x, e.y, 4, '#ff8a3a', 80, 0.4, 2); }
        }
        // hermanas
        if (this.has('sister')) {
          const n = this.donCount('hermana');
          for (let k = 0; k < n; k++) {
            const a = this.roomT * 3.2 + (k * TAU) / n;
            const sx = p.x + Math.cos(a) * 46, sy = p.y + Math.sin(a) * 46;
            if (L.dist(sx, sy, e.x, e.y) < e.r + 8 && !e.sisT) { e.sisT = 0.5; this.damage(e, 1, 'sister'); }
          }
          if (e.sisT) e.sisT = Math.max(0, e.sisT - rdt) || 0;
        }
      }
      // separación
      const es = this.enemies;
      for (let i = 0; i < es.length; i++) for (let j = i + 1; j < es.length; j++) {
        const a = es[i], b = es[j];
        if (a.spawn > 0 || b.spawn > 0) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = (a.r + b.r) * 0.9;
        if (d < m && d > 0.01) {
          const push = (m - d) / 2, ux = dx / d, uy = dy / d;
          const wa = a.boss ? 0 : 1, wb = b.boss ? 0 : 1;
          a.x -= ux * push * wa; a.y -= uy * push * wa; b.x += ux * push * wb; b.y += uy * push * wb;
        }
      }
      this.enemies = this.enemies.filter((e) => !e.dead);
    }
    touchesTrail(e) {
      const T = this.trail;
      for (let i = 1; i < T.length; i += 1) if (L.segDist(e.x, e.y, T[i - 1].x, T[i - 1].y, T[i].x, T[i].y) < e.r + 3) return true;
      return false;
    }
    clampE(e) { const m = e.r * 0.6; e.x = L.clamp(e.x, m, this.W - m); e.y = L.clamp(e.y, m, this.H - m); }
    shoot(x, y, a, sp, n = 1, spread = 0.2, r = 7) {
      for (let i = 0; i < n; i++) {
        const aa = a + (i - (n - 1) / 2) * spread;
        this.bullets.push({ x, y, vx: Math.cos(aa) * sp, vy: Math.sin(aa) * sp, r, life: 6 });
      }
      this.events.push({ t: 'shoot' });
    }
    ringShot(x, y, n, sp, off = 0) { for (let i = 0; i < n; i++) { const a = off + (i * TAU) / n; this.bullets.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 7, life: 6 }); } this.events.push({ t: 'shoot' }); }

    /* ---------------- jefes ---------------- */
    bossMadre(e, dt, t, mv) {
      const half = e.hp < e.maxHp * 0.5;
      e.timer -= dt;
      if (e.st === 0) { // revoloteo
        const s = Math.sin(e.age * 2) * 0.8;
        mv((t.dx - t.dy * s) * e.speed * 0.7, (t.dy + t.dx * s) * e.speed * 0.7);
        if (e.timer <= 0) { e.st = 1; e.timer = 1.1; e.cx = t.dx; e.cy = t.dy; this.beams.push({ x: e.x, y: e.y, a: Math.atan2(t.dy, t.dx), t: 0, life: 1.1, w: e.r * 1.6, c: '#ffd36e' }); this.events.push({ t: 'tell' }); }
      } else if (e.st === 1) { // aviso
        mv(0, 0);
        if (e.timer <= 0) { e.st = 2; e.timer = 1.1; }
      } else if (e.st === 2) { // embestida
        mv(e.cx * (half ? 640 : 540), e.cy * (half ? 640 : 540));
        if (e.timer <= 0 || e.x <= e.r || e.x >= this.W - e.r || e.y <= e.r || e.y >= this.H - e.r) {
          e.st = 3; e.timer = 0.6;
          const n = half ? 4 : 3;
          for (let i = 0; i < n; i++) { const a = (i / n) * TAU; this.spawnEnemy('polilla', e.x + Math.cos(a) * 70, e.y + Math.sin(a) * 70, { delay: 0.5 }); }
          this.events.push({ t: 'summon' });
        }
      } else { mv(0, 0); if (e.timer <= 0) { e.st = 0; e.timer = half ? 2.4 : 3.4; } }
    }
    bossOjo(e, dt, t, mv) {
      const half = e.hp < e.maxHp * 0.5;
      e.timer -= dt;
      e.shotT = (e.shotT == null ? 1.5 : e.shotT) - dt;
      mv(Math.cos(e.age * 0.8) * 30, Math.sin(e.age * 1.1) * 30);
      if (e.st === 0) {
        if (e.shotT <= 0) {
          e.shotT = half ? 1.6 : 2.2;
          this.ringShot(e.x, e.y, half ? 14 : 11, 150, e.age);
          if (half) this.shoot(e.x, e.y, Math.atan2(t.dy, t.dx), 230, 3, 0.18);
        }
        if (e.timer <= 0) { e.st = 1; e.timer = 0.7; e.fade = 1; this.events.push({ t: 'tell' }); }
      } else if (e.st === 1) {
        e.fade = e.timer / 0.7;
        if (e.timer <= 0) {
          const pos = this.spawnPos(260); e.x = pos.x; e.y = pos.y; e.st = 2; e.timer = 0.6;
          if (this.enemies.length < 7) { const k = half ? 3 : 2; for (let i = 0; i < k; i++) this.spawnEnemy(this.rng.pick(['sombra', 'escupidor', 'polilla']), e.x + this.rng.range(-90, 90), e.y + this.rng.range(-90, 90), { delay: 0.7 }); }
        }
      } else { e.fade = 1 - e.timer / 0.6; if (e.timer <= 0) { e.st = 0; e.fade = 1; e.timer = half ? 4.5 : 6; } }
    }
    bossReina(e, dt, t, mv) {
      const f = e.hp / e.maxHp;
      const ph = f > 0.66 ? 1 : f > 0.33 ? 2 : 3;
      if (ph !== e.phase) { e.phase = ph; e.st = 0; e.timer = 1.2; this.ring(e.x, e.y, '#ff5aa0', 300); this.shake = 12; this.text(e.x, e.y - 80, ph === 2 ? '¡La Reina se enfurece!' : '¡El eclipse total!', '#ff9ac8', 1.8); this.events.push({ t: 'phase' }); for (let i = 0; i < 6 + ph * 2; i++) this.bullets.push({ x: e.x, y: e.y, vx: Math.cos(i) * 200, vy: Math.sin(i) * 200, r: 8, life: 5 }); }
      e.timer -= dt;
      e.shotT = (e.shotT == null ? 2 : e.shotT) - dt;
      e.sumT = (e.sumT == null ? 4 : e.sumT) - dt;
      if (ph === 1) {
        mv(t.dx * e.speed * 0.6, t.dy * e.speed * 0.6);
        if (e.shotT <= 0) { e.shotT = 2.8; this.ringShot(e.x, e.y, 12, 150, e.age); }
        if (e.sumT <= 0 && this.enemies.length < 12) { e.sumT = 6; const c = this.spawnPos(); for (let i = 0; i < 5; i++) this.spawnEnemy('enjambre', c.x + this.rng.range(-40, 40), c.y + this.rng.range(-40, 40), { delay: 0.8 }); }
      } else if (ph === 2) {
        const cx = this.W / 2 + Math.cos(e.age * 0.5) * this.W * 0.25, cy = this.H / 2 + Math.sin(e.age * 0.7) * this.H * 0.2;
        mv((cx - e.x) * 1.2, (cy - e.y) * 1.2);
        if (e.shotT <= 0) { e.shotT = 0.16; const a = e.age * 2.3; this.bullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 170, vy: Math.sin(a) * 170, r: 7, life: 5, cut: true }); this.bullets.push({ x: e.x, y: e.y, vx: -Math.cos(a) * 170, vy: -Math.sin(a) * 170, r: 7, life: 5, cut: true }); if (Math.floor(e.age * 6) % 3 === 0) this.events.push({ t: 'shoot' }); }
        if (e.sumT <= 0 && this.enemies.length < 10) { e.sumT = 7; for (let i = 0; i < 2; i++) { const c = this.spawnPos(); this.spawnEnemy('tijereta', c.x, c.y, { delay: 0.8 }); } }

  U.on = (sel, ev, fn) => scr().querySelectorAll(sel).forEach((el) => el.addEventListener(ev, (e) => fn(el, e)));
  U.toast = function (html) { const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = html; $('toasts').appendChild(t); setTimeout(() => t.remove(), 3500); };
  U.banner = function (title, sub, color) {
    const b = document.createElement('div'); b.className = 'big-banner'; b.style.setProperty('--bc', color || '#ffd76a');
    b.innerHTML = `<b>${title}</b>${sub ? `<span>${sub}</span>` : ''}`;
    document.body.appendChild(b); setTimeout(() => b.remove(), 2300);
  };
  U.tip = function (html, x, y) { const t = $('tip'); t.innerHTML = html; t.classList.add('show'); const w = t.offsetWidth, h = t.offsetHeight; t.style.left = L.clamp(x - w / 2, 6, innerWidth - w - 6) + 'px'; t.style.top = (y - h - 12 < 6 ? y + 24 : y - h - 12) + 'px'; };
  U.hideTip = () => $('tip').classList.remove('show');
  document.addEventListener('pointerover', (e) => {
    const el = e.target.closest && e.target.closest('[data-don]');
    if (!el) return;
    const d = L.DON[el.dataset.don]; const r = el.getBoundingClientRect();
    U.tip(`<b style="color:${L.RARITY[d.r].color}">${d.name}</b>${d.desc}`, r.left + r.width / 2, r.top);
  });
  document.addEventListener('pointerout', (e) => { if (e.target.closest && e.target.closest('[data-don]')) U.hideTip(); });

  const heartSVG = (cls) => `<div class="hrt ${cls || ''}">${L.icon('heart').replace('fill="none"', 'fill="currentColor"')}</div>`;
  U.heartSVG = heartSVG;
  U.donCard = function (d, extra = '') {
    const R = L.RARITY[d.r];
    return `<div class="card" data-id="${d.id}" style="--rc:${R.color}"><div class="ic">${L.icon(d.icon)}</div><div class="txt"><div class="rar">${R.name}</div><h3>${d.name}</h3><p>${d.desc}</p>${extra}</div></div>`;
  };
  U.donRow = function (w) {
    const counts = {};
    for (const d of w.dones) counts[d.id] = (counts[d.id] || 0) + 1;
    return `<div class="donrow">${Object.keys(counts).map((id) => { const d = L.DON[id]; return `<div class="dmini" data-don="${id}" style="--rc:${L.RARITY[d.r].color}">${L.icon(d.icon)}${counts[id] > 1 ? `<i>×${counts[id]}</i>` : ''}</div>`; }).join('')}</div>`;
  };
  U.runBar = function (w) {
    let hs = '';
    for (let i = 0; i < w.p.st.maxHearts; i++) hs += heartSVG(i < w.p.hearts ? '' : 'empty');
    return `<div class="runbar"><div class="hs">${hs}</div><div id="polen" style="font-size:16px"><span class="pdot"></span><b>${w.polen}</b></div>${w.dones.length ? U.donRow(w) : '<span style="color:var(--muted);font-size:14px">Aún sin dones</span>'}</div>`;
  };

  /* ---------------- menú principal ---------------- */
  U.menu = function (hasRun, cb) {
    U.show(`<div class="menu">
      <div class="title">Lazo</div>
      <div class="tagline">Una luciérnaga contra la noche</div>
      <div class="btns">
        ${hasRun ? '<button class="btn" data-a="continue">Continuar</button>' : ''}
        <button class="btn ${hasRun ? 'sky' : ''}" data-a="new">${hasRun ? 'Nueva partida' : 'Jugar'}</button>
        <button class="btn alt" data-a="how">Cómo se juega</button>
        <button class="btn alt" data-a="codex">Diario de la noche</button>
        <button class="btn alt" data-a="opts">Opciones</button>
      </div></div><div class="foot">Lazo · un juego original · v1.0</div>`, false);

  /* ---------------- elegir luciérnaga ---------------- */
  U.charSelect = function (meta, cb, back) {
    let sel = meta.lastChar && meta.unlocked(meta.lastChar) ? meta.lastChar : 'lumi';
    let moon = Math.min(meta.d.lastMoon || 0, meta.d.maxMoon);
    const draw = () => {
      U.show(`<div class="box"><h2>Elige tu luciérnaga</h2><div class="sub">Cada una brilla a su manera</div>
        <div class="chars">${L.CHARS.map((c) => { const un = meta.unlocked(c.id); return `<div class="char ${c.id === sel ? 'on' : ''} ${un ? '' : 'locked'}" data-c="${c.id}" style="--cc:${c.color}"><div class="fly">${L.icon(un ? 'firefly' : 'lock')}</div><b>${un ? c.name : '???'}</b></div>`; }).join('')}</div>
        <div class="chardesc">${(() => { const c = L.CHARS.find((x) => x.id === sel); return meta.unlocked(c.id) ? c.desc : '🔒 ' + c.unlock.text; })()}</div>
        <div class="moons">${L.MOONS.map((m, i) => `<div class="moon ${i === moon ? 'on' : ''} ${i > meta.d.maxMoon ? 'locked' : ''}" data-m="${i}" style="--mx:${Math.round(100 - i * 20)}%" title="${m.name}"></div>`).join('')}</div>
        <div class="moondesc"><b>${L.MOONS[moon].name}</b> · ${L.MOONS[moon].desc}${moon > 0 ? ' (y las anteriores)' : ''}</div>
        <div class="row"><button class="btn alt" data-a="back">Volver</button><button class="btn" data-a="go" ${meta.unlocked(sel) ? '' : 'disabled'}>¡A volar!</button></div></div>`);
      U.on('[data-c]', 'click', (el) => { sel = el.dataset.c; snd('click'); draw(); });
      U.on('[data-m]', 'click', (el) => { const m = +el.dataset.m; if (m <= meta.d.maxMoon) { moon = m; snd('click'); draw(); } else { snd('error'); U.toast('Gana una partida en ' + L.MOONS[m - 1].name + ' para desbloquearla'); } });
      U.on('[data-a=back]', 'click', () => { snd('click'); back(); });
      U.on('[data-a=go]', 'click', () => { snd('pick'); cb(sel, moon); });
    };
    draw();
  };

  /* ---------------- mapa ---------------- */
  U.map = function (w, cb, menu) {
    const B = w.biome();
    const nodes = w.map.nodes;
    const av = new Set(w.available());
    const visited = new Set(w.visited || []);
    const VW = 400, rowH = 74, VH = (w.map.layers) * rowH + 40;
    const nx = (n) => 30 + n.x * (VW - 60);
    const ny = (n) => VH - 40 - n.l * rowH;
    let edges = '';
    for (const n of nodes) for (const m of n.next) {
      const a = nodes[m];
      const lit = (w.pos === n.id && av.has(m)) || (visited.has(n.id) && visited.has(m));
      edges += `<line x1="${nx(n)}" y1="${ny(n)}" x2="${nx(a)}" y2="${ny(a)}" stroke="${lit ? '#ffe7a0' : 'rgba(255,255,255,.22)'}" stroke-width="${lit ? 3 : 2}" stroke-dasharray="${lit ? '' : '2 7'}" stroke-linecap="round"/>`;
    }
    let ns = '';
    for (const n of nodes) {
      const T = L.NODE_TYPES[n.type];
      const isAv = av.has(n.id), isCur = w.pos === n.id, isDone = visited.has(n.id);
      const r = n.type === 'boss' ? 28 : 20;
      const cls = isAv ? 'avail' : isDone || isCur ? 'done' : 'dimmed';
      ns += `<g class="mapnode ${cls}" data-n="${n.id}" transform="translate(${nx(n)} ${ny(n)})">
        <circle class="halo" r="${r + 9}" fill="none" stroke="${T.color}" stroke-width="2"/>
        <circle r="${r}" fill="${isCur ? '#ffe7a0' : 'rgba(10,10,30,.85)'}" stroke="${T.color}" stroke-width="${isAv ? 3 : 2}"/>
        <g transform="translate(${-r * 0.6} ${-r * 0.6}) scale(${(r * 1.2) / 48})" style="color:${isCur ? '#1a1030' : T.color}" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">${L.ICONS[T.icon]}</g>
      </g>`;
    }
    U.show(`<div class="mapwrap">
      <div class="maphead"><h2 style="color:${B.motes}">${B.name}</h2><div class="sub">${B.sub} · elige tu camino</div></div>
      ${U.runBar(w)}
      <svg class="mapsvg" viewBox="0 0 ${VW} ${VH}">${edges}${ns}</svg>
      <div class="row" style="margin-top:4px"><button class="btn alt small" data-a="menu">${L.icon('pause').replace('class="ico ', 'style="width:16px;height:16px;display:inline-block;vertical-align:-3px" class="ico ')} Menú</button></div>
    </div>`, true);
    const s = scr();
    s.querySelectorAll('.mapnode').forEach((g) => {
      const n = nodes[+g.dataset.n]; const T = L.NODE_TYPES[n.type];
      g.addEventListener('pointerenter', () => { const r = g.getBoundingClientRect(); U.tip(`<b style="color:${T.color}">${T.name}</b>${T.desc}`, r.left + r.width / 2, r.top); if (av.has(n.id)) snd('hover'); });
      g.addEventListener('pointerleave', U.hideTip);
      g.addEventListener('click', () => { if (av.has(n.id)) { snd('pick'); U.hideTip(); cb(n.id); } else snd('error'); });
    });
    U.on('[data-a=menu]', 'click', () => { snd('click'); menu(); });
  };

  /* ---------------- recompensa ---------------- */
  U.reward = function (w, title, sub, choices, cb, skipPolen = 10) {
    U.show(`<div class="box" style="width:min(720px,100%)"><h2>${title}</h2><div class="sub">${sub}</div>
      <div class="cards">${choices.map((d) => U.donCard(d, w.donCount(d.id) ? `<div class="own">Tienes ${w.donCount(d.id)}</div>` : '')).join('')}</div>
      <div class="row"><button class="btn alt small" data-a="skip">Dejarlo (+${skipPolen} de polen)</button></div></div>`);
    U.on('.card', 'click', (el) => { snd('pick'); cb(el.dataset.id); });
    U.on('[data-a=skip]', 'click', () => { snd('click'); cb(null); });
  };

  /* ---------------- mercado ---------------- */
  U.shop = function (w, stock, cb) {
    const price = (it) => it.price;
    const draw = () => {
      U.show(`<div class="box" style="width:min(860px,100%)"><h2>Mercado de la Noche</h2><div class="sub">Una polilla mercader extiende su manta de tesoros</div>
        ${U.runBar(w)}
        <div class="cards" style="margin-top:16px">${stock.items.map((it, i) => {
          if (it.kind === 'don') { const d = L.DON[it.id]; return U.donCard(d, `<div class="price"><span class="pdot"></span>${it.price}</div>`).replace('class="card"', `class="card ${it.sold ? 'sold' : ''} ${w.polen < it.price ? 'cant' : ''}" data-i="${i}"`); }
          const ic = it.kind === 'heal' ? 'heart' : it.kind === 'max' ? 'heart' : 'swirl';
          const nm = it.kind === 'heal' ? 'Néctar' : it.kind === 'max' ? 'Corazón de Luz' : '';
          const ds = it.kind === 'heal' ? 'Cura 1 corazón.' : 'Ganas 1 corazón máximo.';
          return `<div class="card ${it.sold ? 'sold' : ''} ${w.polen < it.price ? 'cant' : ''}" data-i="${i}" style="--rc:#ff8ac8"><div class="ic">${L.icon(ic)}</div><div class="txt"><div class="rar">Remedio</div><h3>${nm}</h3><p>${ds}</p><div class="price"><span class="pdot"></span>${it.price}</div></div></div>`;
        }).join('')}</div>
        <div class="row"><button class="btn alt small" data-a="reroll" ${w.polen < stock.reroll ? 'disabled' : ''}>Renovar (${stock.reroll})</button><button class="btn" data-a="leave">Seguir el camino</button></div></div>`);
      U.on('[data-i]', 'click', (el) => {
        const it = stock.items[+el.dataset.i];
        if (it.sold) return;
        if (w.polen < it.price) { snd('error'); U.toast('No tienes suficiente polen'); return; }
        if (it.kind === 'heal' && w.p.hearts >= w.p.st.maxHearts) { snd('error'); U.toast('Ya tienes todos los corazones'); return; }
        w.polen -= it.price; it.sold = true; snd('buy');
        if (it.kind === 'don') w.addDon(it.id); else if (it.kind === 'heal') w.heal(1); else { w.p.bonusHearts++; w.recalc(); w.heal(1); }
        cb('buy'); draw();
      });
      U.on('[data-a=reroll]', 'click', () => { if (w.polen < stock.reroll) return; w.polen -= stock.reroll; stock.reroll += 5; cb('reroll'); snd('buy'); draw(); });
      U.on('[data-a=leave]', 'click', () => { snd('click'); cb('leave'); });
    };
    draw();
  };

  /* ---------------- manantial ---------------- */
  U.fountain = function (w, cb) {

      <div class="sub">${won ? 'La Reina Eclipse ha caído y el sol vuelve a salir.' : 'Pero las luciérnagas siempre vuelven a brillar.'}</div>
      <div class="stats">
        <div class="stat"><b>${L.fmt(s.score)}</b><span>Puntuación</span></div>
        <div class="stat"><b>${w.biome().name.split(' ')[0]} ${w.floor + 1}</b><span>Noche alcanzada</span></div>
        <div class="stat"><b>${s.loops}</b><span>Lazos cerrados</span></div>

  /* ---------------- diario (códice) ---------------- */
  U.codex = function (meta, back) {
    let tab = 'dones';
    const draw = () => {
      let body = '';
      if (tab === 'dones') {
        const n = L.DONES.filter((d) => meta.d.seen['d:' + d.id]).length;
        body = `<div class="sub" style="margin-top:0">${n} / ${L.DONES.length} dones descubiertos</div><div class="grid">${L.DONES.map((d) => meta.d.seen['d:' + d.id] ? `<div class="gi" style="--rc:${L.RARITY[d.r].color}"><div class="gic">${L.icon(d.icon)}</div><div><b>${d.name}</b><small>${d.desc}</small></div></div>` : `<div class="gi unk"><div class="gic">${L.icon('question')}</div><div><b>???</b><small>Aún por descubrir</small></div></div>`).join('')}</div>`;
      } else if (tab === 'sombras') {
        const ids = Object.keys(L.ENEMIES);
        body = `<div class="grid">${ids.map((id) => { const E = L.ENEMIES[id]; return meta.d.seen['e:' + id] ? `<div class="gi" style="--rc:${E.eye}"><div class="gic" style="background:${E.color};border-radius:50%">${L.icon(E.boss ? 'crown' : 'veil')}</div><div><b>${E.name}</b><small>${E.desc}</small></div></div>` : `<div class="gi unk"><div class="gic">${L.icon('question')}</div><div><b>???</b><small>Aún no la has visto</small></div></div>`; }).join('')}</div>`;
      } else if (tab === 'logros') {
        body = `<div class="grid">${L.ACH.map((a) => `<div class="gi ${meta.d.ach[a.id] ? '' : 'unk'}" style="--rc:#ffd76a"><div class="gic">${L.icon(meta.d.ach[a.id] ? 'stars' : 'lock')}</div><div><b>${a.name}</b><small>${a.desc}</small></div></div>`).join('')}</div>`;
      } else {
        const s = meta.d.stats;
        body = `<div class="stats"><div class="stat"><b>${s.runs}</b><span>Partidas</span></div><div class="stat"><b>${s.wins}</b><span>Amaneceres</span></div><div class="stat"><b>${L.fmt(s.best)}</b><span>Mejor puntuación</span></div><div class="stat"><b>×${s.combo}</b><span>Mejor lazo</span></div><div class="stat"><b>${L.fmt(s.kills)}</b><span>Sombras atrapadas</span></div><div class="stat"><b>${L.fmt(s.loops)}</b><span>Lazos cerrados</span></div></div>`;
      }
      U.show(`<div class="box" style="width:min(820px,100%)"><h2>Diario de la noche</h2><div class="sub">Todo lo que has visto bajo las estrellas</div>
        <div class="tabs">${[['dones', 'Dones'], ['sombras', 'Sombras'], ['logros', 'Logros'], ['stats', 'Estadísticas']].map(([k, n]) => `<div class="tab ${k === tab ? 'on' : ''}" data-t="${k}">${n}</div>`).join('')}</div>${body}
        <div class="row"><button class="btn alt" data-a="back">Volver</button></div></div>`);
      U.on('[data-t]', 'click', (el) => { tab = el.dataset.t; snd('click'); draw(); });
      U.on('[data-a=back]', 'click', () => { snd('click'); back(); });
    };
    draw();
  };

      U.show(`<div class="box" style="width:min(520px,100%)"><h2>Opciones</h2>

        <div class="row"><button class="btn alt small" data-a="reset">Borrar progreso</button><button class="btn" data-a="back">Volver</button></div></div>`);
      $('o-sfx').oninput = (e) => { s.sfx = +e.target.value; apply(); };
      $('o-mus').oninput = (e) => { s.music = +e.target.value; apply(); };
      $('o-sfx').onchange = () => { meta.save(); snd('polen'); };
      $('o-mus').onchange = () => meta.save();
      U.on('[data-k]', 'click', (el) => { const k = el.dataset.k, v = el.dataset.v; s[k] = k === 'shake' ? v === '1' : v; meta.save(); apply(); snd('click'); draw(); });

    };
    draw();
  };

  U.howto = function (back) {

      ['Vuela', 'Mueve tu luciérnaga con el <b>ratón</b>, las <b>flechas/WASD</b> o <b>arrastrando el dedo</b>. Dejas tras de ti una estela de luz.'],

      ['Esquiva', 'Si una sombra te toca, pierdes un corazón. Usa el <b>impulso</b> (clic, Espacio o el botón táctil) para atravesar el peligro. Cuidado: los orbes y las tijeretas <b>cortan tu estela</b>.'],

      ['Dones', 'Tras cada sala eliges un <b>don</b>. Combínalos: estelas ardientes, ecos, supernovas, hermanas que orbitan… Ninguna partida será igual.'],
    ];
    let i = 0;
    const draw = () => {
      U.show(`<div class="box howto" style="width:min(560px,100%)"><h2>${pages[i][0]}</h2>
        <div class="demo"><svg viewBox="0 0 220 120" width="260" height="140">${demo(i)}</svg></div>
        <p style="text-align:center">${pages[i][1]}</p>
        <div class="row"><button class="btn alt small" data-a="prev" ${i ? '' : 'disabled'}>Anterior</button><button class="btn small" data-a="next">${i === pages.length - 1 ? '¡Entendido!' : 'Siguiente'}</button></div></div>`);
      U.on('[data-a=prev]', 'click', () => { i = Math.max(0, i - 1); snd('click'); draw(); });

    };
    draw();
  };
  function demo(i) {
    const fly = (x, y) => `<circle cx="${x}" cy="${y}" r="14" fill="rgba(255,215,106,.25)"/><circle cx="${x}" cy="${y}" r="6" fill="#ffd76a"/>`;
    const shadow = (x, y) => `<circle cx="${x}" cy="${y}" r="10" fill="#2a2440" stroke="#ff9ad5" stroke-opacity=".6"/><circle cx="${x - 3}" cy="${y - 2}" r="1.8" fill="#ff9ad5"/><circle cx="${x + 3}" cy="${y - 2}" r="1.8" fill="#ff9ad5"/>`;

    if (i === 1) return `<path d="M40 100 C30 40 90 15 140 30 C190 45 180 100 120 105 C80 108 60 80 70 50" stroke="#ffd76a" stroke-width="4" fill="rgba(255,215,106,.12)" stroke-linecap="round"/>${shadow(105, 65)}${shadow(130, 75)}${shadow(90, 85)}${fly(70, 50)}`;
    if (i === 2) return `${shadow(120, 60)}<path d="M40 60 L180 60" stroke="#8fd8ff" stroke-width="6" stroke-dasharray="4 8" stroke-linecap="round"/>${fly(180, 60)}`;
    if (i === 3) return `<g stroke="rgba(255,255,255,.4)" stroke-dasharray="2 6" stroke-width="2"><line x1="40" y1="100" x2="80" y2="60"/><line x1="80" y1="60" x2="140" y2="70"/><line x1="140" y1="70" x2="180" y2="25"/><line x1="40" y1="100" x2="110" y2="105"/><line x1="110" y1="105" x2="140" y2="70"/></g>${[[40, 100, '#9fd8ff'], [80, 60, '#d9b3ff'], [110, 105, '#9cffb0'], [140, 70, '#ffd36e'], [180, 25, '#ff6a9a']].map(([x, y, c]) => `<circle cx="${x}" cy="${y}" r="11" fill="#0d0b22" stroke="${c}" stroke-width="3"/>`).join('')}`;
    return `${[30, 85, 140].map((x, k) => `<rect x="${x}" y="20" width="50" height="80" rx="10" fill="rgba(255,255,255,.06)" stroke="${['#9fd8ff', '#9cffb0', '#ffb36a'][k]}" stroke-width="2"/><circle cx="${x + 25}" cy="52" r="12" fill="${['#9fd8ff', '#9cffb0', '#ffb36a'][k]}" opacity=".5"/>`).join('')}`;
  }

</script>
<script>
/* LAZO — controlador: bucle, entrada, flujo de la partida y progreso */
(function (L) {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const U = L.U, A = L.A, R = L.R;

  /* ---------------- progreso ---------------- */
  const KEY = 'lazo.meta.v1', RUN = 'lazo.run.v1';
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
  const def = () => ({ ach: {}, seen: {}, stats: { runs: 0, wins: 0, best: 0, combo: 0, kills: 0, loops: 0 }, settings: { sfx: 0.7, music: 0.5, shake: true, touch: 'rel' }, maxMoon: 0, lastMoon: 0, lastChar: 'lumi', tutorial: false });
  const Meta = {
    d: def(),
    load() { try { const x = JSON.parse(store.get(KEY) || 'null'); if (x) { const b = def(); this.d = { ...b, ...x, stats: { ...b.stats, ...x.stats }, settings: { ...b.settings, ...x.settings } }; } } catch (e) {} },
    save() { store.set(KEY, JSON.stringify(this.d)); },
    reset() { store.del(KEY); store.del(RUN); this.d = def(); },
    unlocked(id) { const c = L.CHARS.find((x) => x.id === id); return !c.unlock || !!this.d.ach[c.unlock.id]; },
    get lastChar() { return this.d.lastChar; },
  };

  /* ---------------- estado ---------------- */
  let w = null, mode = 'menu', paused = false, last = 0, t = 0, deco = null, roomNode = null;
  let vw = 0, vh = 0, S = 1;
  const isTouch = () => matchMedia('(pointer: coarse)').matches;

  function size() {
    vw = innerWidth; vh = innerHeight;
    S = L.clamp(Math.sqrt(vw * vh) / 720, 0.5, 2.4);
    R.resize(vw, vh, S);
    const W = vw / S, H = vh / S;
    if (w) { if (mode === 'room') w.resize(W, H); else { w.W = W; w.H = H; } }
    if (deco) { deco.W = W; deco.H = H; }
  }
  const worldDims = () => ({ W: vw / S, H: vh / S });

  function applySettings() {
    const s = Meta.d.settings;
    A.setVolumes(s.sfx, s.music);
    R.reduced = !s.shake;
  }

  /* ---------------- entrada ---------------- */
  const keys = {};
  let touchId = null, tStart = null;
  function toWorld(cx, cy) { return { x: cx / S, y: cy / S }; }
  function bindInput() {
    const cv = $('cv');
    cv.addEventListener('pointermove', (e) => {
      if (!w || mode !== 'room') return;
      if (e.pointerType === 'mouse') { const p = toWorld(e.clientX, e.clientY); w.input.tx = p.x; w.input.ty = p.y; }
      else if (e.pointerId === touchId && tStart) {
        if (Meta.d.settings.touch === 'abs') { const p = toWorld(e.clientX, e.clientY - 60); w.input.tx = p.x; w.input.ty = p.y; }
        else { const k = 1.35 / S; w.input.tx = tStart.px + (e.clientX - tStart.x) * k; w.input.ty = tStart.py + (e.clientY - tStart.y) * k; }
      }
    });
    cv.addEventListener('pointerdown', (e) => {
      A.init();
      if (!w || mode !== 'room' || paused) return;
      if (e.pointerType === 'mouse') { if (e.button === 0 || e.button === 2) w.input.dash = true; return; }
      if (touchId == null) {
        touchId = e.pointerId; tStart = { x: e.clientX, y: e.clientY, px: w.p.x, py: w.p.y };
        if (Meta.d.settings.touch === 'abs') { const p = toWorld(e.clientX, e.clientY - 60); w.input.tx = p.x; w.input.ty = p.y; } else { w.input.tx = w.p.x; w.input.ty = w.p.y; }
      }
    });
    const up = (e) => { if (e.pointerId === touchId) { touchId = null; tStart = null; if (w) { w.input.tx = w.p.x + w.p.vx * 0.08; w.input.ty = w.p.y + w.p.vy * 0.08; } } };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    cv.addEventListener('contextmenu', (e) => e.preventDefault());
    addEventListener('keydown', (e) => {
      A.init();
      const k = e.key.toLowerCase();
      keys[k] = true;
      if (mode === 'room' && w) {
        if (k === ' ' || k === 'shift' || k === 'k') { e.preventDefault(); w.input.dash = true; }
        if (k === 'escape' || k === 'p') { paused ? resume() : pause(); }
      }
      updKeys();
    });
    addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; updKeys(); });
    addEventListener('blur', () => { for (const k in keys) keys[k] = false; updKeys(); if (mode === 'room' && !paused) pause(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'room' && !paused) pause(); });
    $('touch-dash').addEventListener('pointerdown', (e) => { e.stopPropagation(); A.init(); if (w && mode === 'room') w.input.dash = true; });
    $('btn-pause').innerHTML = L.icon('pause');
    $('touch-dash').innerHTML = L.icon('bolt');
    $('btn-pause').addEventListener('click', () => { if (mode === 'room') pause(); });
  }
  function updKeys() {
    if (!w) return;
    const x = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0);
    const y = (keys.arrowdown || keys.s ? 1 : 0) - (keys.arrowup || keys.w ? 1 : 0);
    w.input.kx = x; w.input.ky = y;
    if (x || y) w.input.tx = null;
  }

  /* ---------------- HUD ---------------- */
  const hudC = {};
  function hud() {
    if (!w) return;
    const p = w.p;
    const hk = p.hearts + '/' + p.st.maxHearts + '/' + p.shield;
    if (hudC.h !== hk) {
      const prev = hudC.hp; hudC.h = hk; hudC.hp = p.hearts;
      let h = '';
      for (let i = 0; i < p.st.maxHearts; i++) h += U.heartSVG(i < p.hearts ? (prev != null && i === p.hearts - 1 && p.hearts > prev ? 'pop' : '') : 'empty');
      if (p.shield) h += U.heartSVG('shield');
      $('hearts').innerHTML = h;
    }
    if (hudC.pol !== w.polen) { $('polen-v').textContent = w.polen; if (hudC.pol != null && w.polen > hudC.pol) { const el = $('polen'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); } hudC.pol = w.polen; }
    const dk = p.dashCd <= 0 ? 1 : 1 - p.dashCd / p.st.dashCd;
    $('dash-fill').style.width = (dk * 100).toFixed(0) + '%';
    $('dash').classList.toggle('ready', dk >= 1);
    $('touch-dash').classList.toggle('cd', dk < 1);
    let label = '';
    if (w.roomType === 'boss') label = '';
    else if (w.cleared) label = '¡Sala despejada!';
    else label = 'Oleada ' + Math.max(1, w.wave) + ' de ' + w.waves.length + (w.roomType === 'elite' ? ' · Sombras mayores' : '');
    if (hudC.lab !== label) { $('room-label').textContent = label; hudC.lab = label; }
    if (w.boss) {
      $('bossbar').classList.remove('hidden');
      $('boss-name').textContent = L.ENEMIES[w.boss.t].name;
      $('boss-fill').style.width = Math.max(0, (w.boss.hp / w.boss.maxHp) * 100) + '%';
    } else $('bossbar').classList.add('hidden');
  }
  function showHud(on) { $('cv').style.cursor = on ? 'crosshair' : 'default'; $('hud').classList.toggle('hidden', !on); $('touch-dash').classList.toggle('hidden', !on || !isTouch()); for (const k in hudC) delete hudC[k]; }

  /* ---------------- tutorial ---------------- */
  let tutStep = 0;
  function hint(html) { const h = $('hint'); h.innerHTML = html || ''; h.classList.toggle('show', !!html); }
  function tutorial(ev) {
    if (Meta.d.tutorial || mode !== 'room') return;
    if (tutStep === 0) { hint(isTouch() ? 'Arrastra el dedo para volar.<small>Cruza tu propia estela para cerrar un lazo alrededor de las sombras.</small>' : 'Mueve el ratón para volar.<small>Cruza tu propia estela para cerrar un lazo alrededor de las sombras.</small>'); tutStep = 1; }
    if (ev && ev.t === 'loop' && ev.n > 0 && tutStep === 1) { hint('¡Eso es! Cuantas más sombras atrapes de golpe, mejor.<small>' + (isTouch() ? 'Toca el botón del rayo' : 'Haz clic o pulsa Espacio') + ' para dar un impulso y esquivar.</small>'); tutStep = 2; setTimeout(() => { if (tutStep === 2) hint(''); }, 6000); }
    if (ev && ev.t === 'clear' && tutStep >= 1) { tutStep = 3; hint(''); Meta.d.tutorial = true; Meta.save(); }
  }

  /* ---------------- bucle ---------------- */
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(1 / 30, (now - last) / 1000 || 0); last = now; t += dt;
    if (mode === 'room' && w) {
      if (!paused) {
        w.update(dt);
        handleEvents();
      }
      R.draw(w, t);
      hud();
    } else if (mode === 'over' && w) {
      R.draw(w, t);
    } else {
      R.drawIdle(w || deco, t);
    }
  }
  function handleEvents() {
    const evs = w.events; w.events = [];
    for (const ev of evs) {
      switch (ev.t) {
        case 'loop': A.sfx.loop(ev.n, ev.solar); break;
        case 'echo': A.sfx.echo(); break;
        case 'kill': ev.boss ? A.sfx.bossDown() : ev.elite ? A.sfx.bigkill() : A.sfx.kill(); break;
        case 'hurt': A.sfx.hurt(); break;
        case 'dash': A.sfx.dash(); break;
        case 'polen': A.sfx.polen(); break;
        case 'shoot': A.sfx.shoot(); break;
        case 'cut': A.sfx.cut(); break;
        case 'boom': A.sfx.boom(); break;
        case 'wave': if (ev.n > 1) A.sfx.wave(); break;
        case 'clear': A.sfx.clear(); if (w.roomType !== 'boss') U.banner('¡Despejado!', null, '#9cffc8'); break;
        case 'heal': A.sfx.heal(); break;
        case 'shield': A.sfx.shield(); break;
        case 'tell': A.sfx.tell(); break;
        case 'summon': A.sfx.summon(); break;
        case 'phase': A.sfx.phase(); break;
        case 'revive': A.sfx.revive(); U.banner('¡Renaces!', 'La Pluma de Fénix arde por ti', '#ffb36a'); break;
        case 'bossDown': U.banner('¡' + L.ENEMIES[w.boss.t].name + ' ha caído!', null, '#ff8ac8'); break;
        case 'ach': ach(ev.id); break;
        case 'roomDone': afterRoom(); break;
        case 'dead': die(); break;
      }
      tutorial(ev);
    }
    // descubrimientos
    for (const e of w.enemies) if (!Meta.d.seen['e:' + e.t]) { Meta.d.seen['e:' + e.t] = 1; }
  }
  function ach(id) {
    if (Meta.d.ach[id]) return;
    Meta.d.ach[id] = Date.now();
    const a = L.ACH.find((x) => x.id === id);
    if (a) { U.toast('★ Logro: ' + a.name); A.sfx.ach(); }
    for (const c of L.CHARS) if (c.unlock && c.unlock.id === id) setTimeout(() => U.toast('✦ Nueva luciérnaga: ' + c.name), 900);
    if (L.CHARS.every((c) => Meta.unlocked(c.id)) && !Meta.d.ach.todos) ach('todos');
    Meta.save();
  }
  function seeDons() { for (const d of w.dones) Meta.d.seen['d:' + d.id] = 1; }

  /* ---------------- flujo ---------------- */
  function saveRun() { if (w) { seeDons(); store.set(RUN, JSON.stringify(w.save())); Meta.save(); } }
  function menu() {
    mode = 'menu'; paused = false; showHud(false); hint('');
    if (!deco) { deco = new L.World({ seed: 'MENU', ...worldDims() }); }
    w = null;
    A.setMood('menu');
    U.menu(!!store.get(RUN), (a) => {
      if (a === 'continue') continueRun();
      else if (a === 'new') U.charSelect(Meta, startRun, menu);
      else if (a === 'how') U.howto(menu);
      else if (a === 'codex') U.codex(Meta, menu);
      else if (a === 'opts') U.options(Meta, applySettings, menu);
    });
  }
  function startRun(charId, moon) {
    Meta.d.lastChar = charId; Meta.d.lastMoon = moon; Meta.d.stats.runs++; Meta.save();
    w = new L.World({ charId, moon, ...worldDims() });
    w.events = [];
    store.set(RUN, JSON.stringify(w.save()));
    showMap();
  }
  function continueRun() {
    try { const d = JSON.parse(store.get(RUN)); const { W, H } = worldDims(); w = L.World.load(d, W, H); } catch (e) { store.del(RUN); menu(); return; }
    showMap();
  }
  function showMap() {
    mode = 'map'; showHud(false); hint('');
    A.setMood('map');
    saveRun();
    U.map(w, enterNode, () => { saveRun(); menu(); });
  }
  function enterNode(id) {
    const node = w.choose(id);
    if (!node) return;
    roomNode = node;
    saveRun();
    const T = node.type;
    if (T === 'combat' || T === 'elite' || T === 'boss') startRoom(T);
    else if (T === 'treasure') reward('treasure', 'Un cofre de luz', 'Elige un don');
    else if (T === 'shop') shop();
    else if (T === 'fountain') U.fountain(w, (o) => { if (o === 'heal') w.heal(99); else { w.p.bonusHearts++; w.recalc(); } w.events = []; showMap(); });
    else if (T === 'event') event();
  }
  function startRoom(type) {
    U.hide();
    const { W, H } = worldDims(); w.W = W; w.H = H;
    w.startRoom(type);
    mode = 'room'; paused = false; showHud(true);
    A.setMood(type === 'boss' ? 'boss' : w.biome().id);
    if (type === 'boss') { const E = L.ENEMIES[w.boss.t]; U.banner(E.name, E.desc, '#ff6a9a'); A.sfx.phase(); }
    else if (type === 'elite') U.banner('Sombras mayores', 'Más fuertes, mejores premios', '#ff8a8a');
    tutStep = 0; tutorial();
    const it = w.input; it.tx = null; it.kx = it.ky = 0;
  }
  function afterRoom() {
    mode = 'reward'; showHud(false); hint('');
    const type = roomNode.type;
    Meta.d.stats.kills += 0;
    if (type === 'boss') {
      if (w.floor >= 2) { win(); return; }
      reward('boss', '¡Guardián vencido!', 'Elige un don poderoso', () => {
        w.nextFloor(); w.heal(2);
        showMap();
      });
      return;
    }
    reward(type === 'elite' ? 'elite' : 'combat', type === 'elite' ? '¡Sombras mayores vencidas!' : '¡Sala despejada!', 'Elige un don');
  }
  function reward(kind, title, sub, after) {
    mode = 'reward'; showHud(false);
    const ch = w.donChoices(kind);
    U.reward(w, title, sub, ch, (id) => {
      if (id) { w.addDon(id); A.sfx.pick(); } else w.polen += 10;
      w.events = [];
      if (after) after(); else showMap();
    });
  }
  function shop() {
    const f = 1 + w.floor * 0.2;
    const items = [];
    const ex = [];
    for (let i = 0; i < 3; i++) { const d = w.randomDon(1, 3, ex); ex.push(d.id); items.push({ kind: 'don', id: d.id, price: Math.round([0, 32, 55, 85][d.r] * f) }); }
    items.push({ kind: 'heal', price: Math.round(14 * f) });
    items.push({ kind: 'max', price: Math.round(48 * f) });
    const stock = { items, reroll: 10 };
    U.shop(w, stock, (a) => {
      if (a === 'reroll') { const ex2 = []; stock.items = stock.items.map((it) => { if (it.kind !== 'don') return it; const d = w.randomDon(1, 3, ex2); ex2.push(d.id); return { kind: 'don', id: d.id, price: Math.round([0, 32, 55, 85][d.r] * f) }; }); }
      if (a === 'leave') { w.events = []; showMap(); }
    });
  }
  function event() {
    const pool = L.EVENTS.filter((e) => !(w.seenEvents || []).includes(e.id));
    const E = w.rng.pick(pool.length ? pool : L.EVENTS);
    (w.seenEvents = w.seenEvents || []).push(E.id);
    U.event(w, E, (i) => {
      const o = E.opts[i];
      const txt = o.run(w);
      w.events = [];
      U.eventResult(w, E, txt, () => {
        if (w.pendingChoice) { const pc = w.pendingChoice; w.pendingChoice = null; const ch = []; for (let k = 0; k < 3; k++) ch.push(w.randomDon(pc.rarityMin, 3, ch.map((x) => x.id))); U.reward(w, 'Un regalo de la noche', 'Elige un don', ch, (id) => { if (id) w.addDon(id); else w.polen += 10; w.events = []; showMap(); }); }
        else showMap();
      });
    });
  }
  function pause() {
    if (mode !== 'room' || paused) return;
    paused = true; hint('');
    U.pause(w, (a) => {
      if (a === 'resume') resume();
      else if (a === 'opts') U.options(Meta, applySettings, () => { paused = false; pause(); });
      else if (a === 'how') U.howto(() => { paused = false; pause(); });
      else if (a === 'quit') { endRun(false); }
    });
  }
  function resume() { paused = false; U.hide(); last = performance.now(); }
  function recordEnd(won) {
    const s = Meta.d.stats, st = w.stats;
    s.kills += st.kills; s.loops += st.loops; s.best = Math.max(s.best, st.score); s.combo = Math.max(s.combo, st.bestCombo);
    if (won) { s.wins++; if (w.moon >= Meta.d.maxMoon && w.moon < L.MOONS.length - 1) Meta.d.maxMoon = w.moon + 1; }
    seeDons(); store.del(RUN); Meta.save();
  }
  function die() {
    mode = 'over'; showHud(false); hint('');
    A.sfx.dead();
    setTimeout(() => endRun(false), 1400);
  }
  function endRun(won) {
    const before = L.CHARS.filter((c) => Meta.unlocked(c.id)).length;
    recordEnd(won);
    const news = [];
    if (won && w.moon + 1 === Meta.d.maxMoon && w.moon + 1 < L.MOONS.length) news.push('✦ Nueva dificultad: ' + L.MOONS[w.moon + 1].name);
    const after = L.CHARS.filter((c) => Meta.unlocked(c.id)).length;
    if (after > before) news.push('✦ ¡Has desbloqueado una nueva luciérnaga!');
    mode = 'end'; showHud(false); paused = false;
    U.end(w, won, news, (a) => { if (a === 'again') { const c = w.charId, m = w.moon; startRun(c, m); } else menu(); });
  }
  function win() {
    ach('victoria');
    if (w.stats.time < 20 * 60) ach('velocista');
    if (w.moon >= 3) ach('luna3');
    A.sfx.victory();
    U.banner('¡Amanece!', 'La noche ha terminado', '#ffe7a0');
    setTimeout(() => endRun(true), 1800);
  }

  function boot() {
    Meta.load();
    R.init($('cv'));
    size();
    applySettings();
    bindInput();
    addEventListener('resize', size);
