  }

  const ENH_BADGE = { ambar: 'bee', rubi: 'gem', cristal: 'prism', oro: 'coin', hierro: 'anvil', prisma: 'prism', fortuna: 'clover' };
  const ENH_COL = { ambar: '#b6740c', rubi: '#b0203a', cristal: '#2a8ab0', oro: '#9a620c', hierro: '#3a4656', prisma: '#8a4ad0', fortuna: '#2f8a2f' };

  BR.Art = {};
  BR.Art.cardSVG = function (c) {
    if (c.enh === 'piedra') return `<svg viewBox="0 0 200 280" class="cv">${stoneFace()}${sealSVG(c)}</svg>`;
    const S = BR.SUIT_INFO[c.suit];
    const col = S.color, dk = S.dark;
    const paper = c.enh ? PAPER[c.enh] : 'g-paper';
    const solid = PAPER_SOLID[c.enh || 'none'];
    const R = BR.RANK_INFO[c.rank];
    let center = '';
    if (c.rank === 1) {
      center = `<circle cx="100" cy="140" r="66" fill="${col}" fill-opacity=".08" stroke="${col}" stroke-width="2" stroke-dasharray="3 6"/>
        <g stroke="${col}" stroke-opacity=".35" stroke-width="2">${Array.from({ length: 16 }, (_, i) => { const a = (i / 16) * Math.PI * 2; return `<path d="M${100 + Math.cos(a) * 60} ${140 + Math.sin(a) * 60}L${100 + Math.cos(a) * 72} ${140 + Math.sin(a) * 72}"/>`; }).join('')}</g>
        ${suitUse(c.suit, 44, 84, 112)}`;
    } else if (c.rank >= 10) center = figure(c.rank, c.suit);
    else {
      const sz = c.rank <= 3 ? 50 : c.rank <= 5 ? 44 : 40;
      center = PIPS[c.rank].map(([x, y]) => suitUse(c.suit, x - sz / 2, y - sz / 2, sz)).join('');
    }
    const n = PINTAS[c.suit];
    let gaps = '';
    for (let i = 0; i < n; i++) { const x = 100 + (i - (n - 1) / 2) * 18 - 5; gaps += `<rect x="${x}" y="9" width="10" height="7" fill="${solid}"/><rect x="${x}" y="264" width="10" height="7" fill="${solid}"/>`; }
    const idx = `<text x="25" y="47" text-anchor="middle" font-family="Cinzel, serif" font-weight="700" font-size="${R.short.length > 1 ? 30 : 36}" fill="${dk}">${R.short}</text>${suitUse(c.suit, 11, 52, 28)}`;
    const border = c.enh === 'prisma' ? 'url(#g-prisma)' : col;
    let badge = '';
    if (c.enh && ENH_BADGE[c.enh]) badge = `<g transform="translate(160 14)"><circle cx="13" cy="13" r="14" fill="#fffaf0" stroke="${ENH_COL[c.enh]}" stroke-width="2.5"/><g transform="translate(2 2) scale(.34)" stroke="${ENH_COL[c.enh]}" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">${BR.ICONS[ENH_BADGE[c.enh]]}</g></g>`;
    return `<svg viewBox="0 0 200 280" class="cv">
      <rect x="2" y="2" width="196" height="276" rx="14" fill="url(#${paper})" stroke="rgba(0,0,0,.25)" stroke-width="2"/>
      ${c.enh === 'fortuna' ? `<g opacity=".12" transform="translate(52 92) scale(1.5)" stroke="#1a6a1a" stroke-width="3" fill="none">${BR.ICONS.clover}</g>` : ''}
      <rect x="12" y="12" width="176" height="256" rx="9" fill="none" stroke="${border}" stroke-width="${c.enh === 'prisma' ? 6 : 3}"/>
      ${gaps}
      ${center}
      ${idx}
      <g transform="rotate(180 100 140)">${idx}</g>
      ${badge}
      ${c.bonus ? `<g><rect x="70" y="248" width="60" height="18" rx="9" fill="#2e6fd8"/><text x="100" y="262" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="700" font-size="13" fill="#fff">+${c.bonus}</text></g>` : ''}
      ${sealSVG(c)}
    </svg>`;
  };
  function sealSVG(c) {
    if (!c.seal) return '';
    const col = BR.SEALS[c.seal].color;
    return `<g transform="translate(14 222)"><path d="M18 0l5 5 7-1 1 7 5 5-5 5-1 7-7-1-5 5-5-5-7 1-1-7-5-5 5-5 1-7 7 1z" fill="${col}" stroke="rgba(0,0,0,.45)" stroke-width="2"/><circle cx="18" cy="18" r="9" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/><path d="M18 12l2 4 4 1-3 3 1 4-4-2-4 2 1-4-3-3 4-1z" fill="rgba(255,255,255,.75)"/></g>`;
  }

  BR.Art.backSVG = function (deckId) {

  BR.Art.talismanHTML = function (t) {
    const d = BR.TAL_BY_ID[t.id];
    const rc = BR.RARITY[d.rarity].color;
    const len = d.name.length;
    return `<div class="tface r${d.rarity}" style="--h:${d.hue};--rc:${rc}">
      <svg class="tframe" viewBox="0 0 200 280"><use href="#tal-frame"/></svg>
      ${BR.icon(d.icon, 'ticon')}
      <div class="tname ${len > 14 ? 'long' : ''}">${d.name}</div>
    </div>`;
  };

  function starPattern(id) {
    let s = BR.hashSeed('const-' + id);
    const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
    const n = 5 + Math.floor(rnd() * 3);
    const pts = [];
    for (let i = 0; i < n; i++) pts.push([30 + rnd() * 140, 50 + rnd() * 140]);
    pts.sort((a, b) => a[0] - b[0]);
    let lines = '';
    for (let i = 1; i < pts.length; i++) lines += `<path d="M${pts[i - 1][0].toFixed(1)} ${pts[i - 1][1].toFixed(1)}L${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)}"/>`;
    if (n > 5) lines += `<path d="M${pts[1][0].toFixed(1)} ${pts[1][1].toFixed(1)}L${pts[n - 2][0].toFixed(1)} ${pts[n - 2][1].toFixed(1)}" stroke-dasharray="3 5"/>`;
    let stars = '';
    for (let i = 0; i < 26; i++) stars += `<circle cx="${(rnd() * 190 + 5).toFixed(1)}" cy="${(rnd() * 270 + 5).toFixed(1)}" r="${(rnd() * 1.2 + 0.3).toFixed(1)}" fill="#fff" opacity="${(rnd() * 0.6 + 0.2).toFixed(2)}"/>`;
    const big = pts.map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="#fff6d0"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10" fill="#9fd8ff" opacity=".25"/>`).join('');
    return `${stars}<g stroke="#9fd8ff" stroke-width="2" opacity=".75" fill="none">${lines}</g>${big}`;
  }

  BR.Art.consHTML = function (k) {
    const d = BR.consDef(k);
    if (k.type === 'con') {

      if (g && g.r && g.r.trump && o.enh !== 'piedra' && g.suitIs(o, g.r.trump)) ext.push('Palo de Triunfo: +' + (g.flags.trumpMult || 1) + ' Mult al puntuar');
      if (o._debuffed || (g && g.isDebuffed && g.phase === 'round' && g.isDebuffed(o))) ext.push('⚠ Debilitada: no puntúa');
      body = [body.join('<br>')];
    } else if (kind === 'tal') {
      const d = BR.TAL_BY_ID[o.id];
      if (!o.st) o = { ...o, st: d.init ? d.init() : {} };
      title = d.name;
      tag(BR.RARITY[d.rarity].name, BR.RARITY[d.rarity].color);
      if (o.ed) tag(BR.EDITIONS[o.ed].name, '#2a8ab0');
      body.push(d.text(o, g));
      if (d.copy && g) {
        const e = BR.effDef(g, o);
        ext.push(e ? 'Copiando: ' + e.def.name : 'Nada que copiar');
      }
      if (o.ed) body.push(BR.EDITIONS[o.ed].desc);
      if (g && o.uid && g.talismans.includes(o)) ext.push('Valor de venta: $' + g.sellValue(o));
    } else if (kind === 'cons') {
      const d = BR.consDef(o);
      title = d.name;
      tag(o.type === 'aug' ? 'Augurio' : o.type === 'con' ? 'Constelación' : 'Ánima', o.type === 'aug' ? '#8a4ad0' : o.type === 'con' ? '#2a5ab0' : '#1a8a80');
      body.push(d.text(g));
    } else if (kind === 'pack') {
      const K = BR.PACK_KINDS[o.pack], Z = BR.PACK_SIZES[o.size];
      let n = Z.n; if (o.pack === 'tal' || o.pack === 'ani') n = o.size === 'normal' ? 2 : 4;
      title = (Z.name ? Z.name + ' ' : '') + K.name;
      tag('Sobre', K.color);
      body.push(K.desc.replace('{pick}', Z.pick).replace('{n}', n));
    } else if (kind === 'voucher') {
      const d = BR.VOUCHER_BY_ID[o.id];
      title = d.name; tag('Privilegio', '#b8861a'); body.push(d.desc);
    } else if (kind === 'tagi') {
      const d = BR.TAG_BY_ID[o]; title = d.name; tag('Insignia', '#6a4ab0'); body.push(d.desc);
    } else if (kind === 'boss') {
      const d = BR.BOSS_BY_ID[o]; title = d.name; tag(d.final ? 'Guardián final' : 'Guardián', d.color); body.push(d.desc);
    } else if (kind === 'deckinfo') {
      title = BR.DECK_BY_ID[o].name; body.push(BR.DECK_BY_ID[o].desc);
    }
    return `<div class="tt-title">${title}</div>${tags.length ? `<div class="tt-tags">${tags.join('')}</div>` : '<div style="height:6px"></div>'}${body.filter(Boolean).map((b) => `<div class="tt-body">${BR.rich(b)}</div>`).join('')}${ext.map((x) => `<div class="tt-extra">${BR.rich(x)}</div>`).join('')}`;
  };
  const tipEl = () => document.getElementById('tooltip');
  S.showTip = function (html, rect, prefer) {
    const t = tipEl(); t.innerHTML = html; t.classList.add('show');
    const tw = t.offsetWidth, th = t.offsetHeight;
    let x = rect.left + rect.width / 2 - tw / 2, y;
    if (prefer === 'below' || rect.top - th - 12 < 4) y = rect.bottom + 10; else y = rect.top - th - 12;
    if (y + th > innerHeight - 4) y = Math.max(4, rect.top - th - 12);
    x = BR.clamp(x, 6, innerWidth - tw - 6);
    t.style.left = x + 'px'; t.style.top = y + 'px';
  };
  S.hideTip = function () { tipEl().classList.remove('show'); };
  // tooltips para elementos DOM con data-tip
  document.addEventListener('pointerover', (e) => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) return;
    const [kind, id] = el.dataset.tip.split(':');
    let o = id;
    if (kind === 'tal') o = { id };
    if (kind === 'cons') o = { type: el.dataset.ct, id };
    if (kind === 'voucher') o = { id };
    if (kind === 'card') o = JSON.parse(el.dataset.card);
    S.showTip(S.tipHTML(kind, o, kind === 'cons' || kind === 'tal' ? null : BR.game), el.getBoundingClientRect());
  });
  document.addEventListener('pointerout', (e) => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) S.hideTip(); });

  /* ---------------- overlay ---------------- */
  const ov = () => document.getElementById('overlay');
  S.open = function (html, opts = {}) {
    const o = ov();
    o.className = 'show' + (opts.cls ? ' ' + opts.cls : '');
    o.innerHTML = html;
    S.hideTip();
    if (opts.closable) {
      o.onclick = (e) => { if (e.target === o) S.close(); };
    } else o.onclick = null;
    const c = o.querySelector('.close'); if (c) c.onclick = () => { BR.Audio.sfx.button(); S.close(); };
    return o;
  };
  S.close = function () { const o = ov(); o.className = ''; o.innerHTML = ''; S.hideTip(); if (S.onClose) { const f = S.onClose; S.onClose = null; f(); } };
  S.isOpen = () => ov().classList.contains('show');
  S.toast = function (msg, cls) {
    const t = document.createElement('div'); t.className = 'toast ' + (cls || ''); t.innerHTML = msg;
    document.getElementById('toasts').appendChild(t);
    setTimeout(() => t.remove(), 3300);
  };

  /* ---------------- menú principal ---------------- */
  S.mainMenu = function (hasSave, cb) {
    const deco = [
      { suit: 'oros', rank: 1 }, { suit: 'copas', rank: 12 }, { suit: 'espadas', rank: 11 }, { suit: 'bastos', rank: 10 }, { suit: 'copas', rank: 3 },
    ].map((c, i) => `<div class="mc" style="transform:translateX(${(i - 2) * 72 - 45}px) rotate(${(i - 2) * 9}deg) translateY(${Math.abs(i - 2) * 12}px);animation-delay:${-i * 1.1}s">${BR.Art.cardSVG(c)}</div>`).join('');
    const o = S.open(`<div class="mainmenu">
      <div class="logo">BRISKA</div>
      <div class="tagline">naipes bajo las estrellas</div>
      <div class="menucards">${deco}</div>
      <div class="menubtns">
        ${hasSave ? '<button class="btn play big" data-a="continue">Continuar partida</button>' : ''}
        <button class="btn ${hasSave ? 'blue' : 'play big'}" data-a="new">Nueva partida</button>
        <button class="btn gold daily" data-a="daily">Reto del día <span class="dsub">${(() => { const d = BR.Meta.dailyInfo(); return BR.DECK_BY_ID[d.deckId].name + (d.best ? ' · récord: Noche ' + d.best.ante : ''); })()}</span></button>
        <button class="btn ghost" data-a="grim">Grimorio</button>

    o.querySelectorAll('[data-a]').forEach((b) => b.onclick = () => { BR.Audio.init(); BR.Audio.sfx.button(); cb(b.dataset.a); });
  };

  /* ---------------- nueva partida ---------------- */
  S.newRun = function (cb) {
    const M = BR.Meta.data;
    let di = Math.max(0, BR.DECKS.findIndex((d) => d.id === M.lastDeck));
    let stake = Math.min(M.lastStake || 0, M.stakeUnlocked);
    const o = S.open(`<div class="modal"><button class="close">×</button>
      <h2>Nueva partida</h2><div class="subtitle">Elige tu baraja y la vela que alumbrará la noche</div>
      <div class="deckpick"><button class="btn ghost arrow" data-d="-1">‹</button><div class="deckshow" id="deckshow"></div><button class="btn ghost arrow" data-d="1">›</button></div>
      <div class="stakes" id="stakes"></div><div class="stakedesc" id="stakedesc"></div>
      <div class="seedrow">Semilla (opcional): <input id="seed" maxlength="10" placeholder="aleatoria"></div>
      <div class="row"><button class="btn play big" id="go">¡A jugar!</button></div></div>`, { closable: true });
    const draw = () => {
      const D = BR.DECKS[di];
      const locked = !M.decks.includes(D.id);
      const won = M.deckWins[D.id];
      o.querySelector('#deckshow').innerHTML = `<div class="dcard ${locked ? 'locked' : ''}">${BR.Art.backSVG(D.id)}${locked ? '<div class="lock">🔒</div>' : ''}</div>
        <div class="dinfo"><h3>${D.name}</h3><div class="ddesc">${BR.rich(D.desc)}</div>
        ${locked ? `<div class="dlock">🔒 ${D.unlock.text}</div>` : ''}
        ${won != null ? `<div class="dwin">Ganada en: <b style="color:${BR.STAKES[won].color}">${BR.STAKES[won].name}</b></div>` : ''}</div>`;
      o.querySelector('#stakes').innerHTML = BR.STAKES.map((s, i) => `<div class="stake ${i === stake ? 'on' : ''} ${i > M.stakeUnlocked ? 'locked' : ''}" data-s="${i}" title="${s.name}"><div class="candle" style="--cc:${s.color}"></div></div>`).join('');
      const st = BR.STAKES[stake];
      o.querySelector('#stakedesc').innerHTML = `<b>${st.name}</b> · ${BR.rich(st.desc)}${stake > 0 ? ' <span style="color:var(--muted)">(+ las anteriores)</span>' : ''}`;
      o.querySelectorAll('.stake').forEach((el) => el.onclick = () => { const s = +el.dataset.s; if (s <= M.stakeUnlocked) { stake = s; BR.Audio.sfx.select(); draw(); } else { BR.Audio.sfx.error(); S.toast('Gana una partida en ' + BR.STAKES[s - 1].name + ' para desbloquearla', 'err'); } });
      o.querySelector('#go').disabled = locked;
    };
    o.querySelectorAll('[data-d]').forEach((b) => b.onclick = () => { di = (di + +b.dataset.d + BR.DECKS.length) % BR.DECKS.length; BR.Audio.sfx.flip(); draw(); });
    o.querySelector('#go').onclick = () => {
      const D = BR.DECKS[di]; if (!M.decks.includes(D.id)) return;
      M.lastDeck = D.id; M.lastStake = stake; BR.Meta.save();
      const seed = o.querySelector('#seed').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
      BR.Audio.sfx.button(); cb({ deckId: D.id, stake, seed: seed || null });
    };
    draw();
  };

  /* ---------------- grimorio ---------------- */
  S.grimoire = function () {
    const tabs = [['tal', 'Talismanes'], ['aug', 'Augurios'], ['con', 'Constelaciones'], ['ani', 'Ánimas'], ['vou', 'Privilegios'], ['boss', 'Guardianes'], ['ach', 'Logros'], ['stats', 'Estadísticas']];
    let cur = 'tal';
    const o = S.open(`<div class="modal" style="width:min(860px,100%)"><button class="close">×</button><h2>Grimorio</h2>
      <div class="subtitle">Todo lo que has descubierto bajo las estrellas</div>
      <div class="tabs" id="gtabs"></div><div id="gbody"></div></div>`, { closable: true });
    const M = BR.Meta;
    const draw = () => {
      o.querySelector('#gtabs').innerHTML = tabs.map(([k, n]) => `<div class="tab ${k === cur ? 'on' : ''}" data-t="${k}">${n}</div>`).join('');
      o.querySelectorAll('.tab').forEach((t) => t.onclick = () => { cur = t.dataset.t; BR.Audio.sfx.select(); draw(); });
      let html = '';
      const grid = (items, total) => `<div class="grimcount">${items.filter((i) => i.known).length} / ${total} descubiertos</div><div class="cgrid">${items.map((i) => i.known ? i.html : '<div class="ci unk">?</div>').join('')}</div>`;
      if (cur === 'tal') {
        const items = BR.TALISMANS.map((t) => ({ known: M.isDisc('tal', t.id), html: `<div class="ci" data-tip="tal:${t.id}"><div class="face front">${BR.Art.talismanHTML({ id: t.id })}</div></div>` }));
        html = grid(items, BR.TALISMANS.length);
      } else if (cur === 'aug' || cur === 'con' || cur === 'ani') {
        const list = cur === 'aug' ? BR.AUGURIOS : cur === 'con' ? BR.CONSTS : BR.ANIMAS;
        const items = list.map((c) => ({ known: M.isDisc(cur, c.id), html: `<div class="ci" data-tip="cons:${c.id}" data-ct="${cur}"><div class="face front">${BR.Art.consHTML({ type: cur, id: c.id })}</div></div>` }));
        html = grid(items, list.length);
      } else if (cur === 'vou') {
        const items = BR.VOUCHERS.map((v) => ({ known: M.isDisc('vou', v.id), html: `<div class="ci" data-tip="voucher:${v.id}"><div class="face front" style="box-shadow:none">${BR.Art.voucherHTML({ id: v.id })}</div></div>` }));
        html = grid(items, BR.VOUCHERS.length);
      } else if (cur === 'boss') {
        const items = BR.BOSSES.map((b) => ({ known: M.isDisc('boss', b.id), html: `<div class="ci" data-tip="boss:${b.id}" style="display:grid;place-items:center;background:rgba(0,0,0,.3);border-radius:10px">${BR.Art.bossMedal(b.id, 58)}<div style="font-size:11px;text-align:center;font-weight:700;margin-top:-18px">${b.name}</div></div>` }));
        html = grid(items, BR.BOSSES.length);
      } else if (cur === 'ach') {
        const A = M.data.ach || {};
        const n = M.ACH.filter((a) => A[a.id]).length;
        html = `<div class="grimcount">${n} / ${M.ACH.length} logros</div><div class="achgrid">${M.ACH.map((a) => `<div class="achi ${A[a.id] ? 'on' : ''}"><div class="achic">${BR.icon(a.icon)}</div><div><b>${a.name}</b><div>${a.desc}</div></div></div>`).join('')}</div>`;
      } else {
        const st = M.data.stats;
        const fav = Object.entries(st.playedTypes).sort((a, b) => b[1] - a[1])[0];
        html = `<div class="statgrid">
          <div class="s"><div class="v">${st.runs}</div><div class="l">Partidas</div></div>
          <div class="s"><div class="v">${st.wins}</div><div class="l">Victorias</div></div>
          <div class="s"><div class="v">${BR.fmt(st.bestHand)}</div><div class="l">Mejor mano</div></div>
          <div class="s"><div class="v">${st.bestAnte}</div><div class="l">Noche más lejana</div></div>
          <div class="s"><div class="v">${BR.fmt(st.hands)}</div><div class="l">Manos jugadas</div></div>
          <div class="s"><div class="v">${fav ? BR.HANDS[fav[0]].name : '—'}</div><div class="l">Mano favorita</div></div>
          <div class="s"><div class="v">${st.cuarenta}</div><div class="l">Las Cuarenta cantadas</div></div>
          <div class="s"><div class="v">${st.bossesBeaten}</div><div class="l">Guardianes vencidos</div></div>
          <div class="s"><div class="v">${M.data.decks.length}/${BR.DECKS.length}</div><div class="l">Barajas</div></div>
        </div>`;
      }
      o.querySelector('#gbody').innerHTML = html;
    };
    draw();
  };

  /* ---------------- opciones ---------------- */
  S.options = function (inRun, cb) {
    const st = BR.Meta.data.settings;
    const o = S.open(`<div class="modal" style="width:min(520px,100%)"><button class="close">×</button><h2>Opciones</h2>
      <div class="optrow"><label>Velocidad del juego</label><div class="seg" id="o-speed">${[1, 2, 3, 4].map((v) => `<button data-v="${v}" class="${st.speed === v ? 'on' : ''}">${v}×</button>`).join('')}</div></div>
      <div class="optrow"><label>Efectos de sonido</label><input type="range" id="o-sfx" min="0" max="1" step="0.05" value="${st.sfx}"></div>
      <div class="optrow"><label>Música</label><input type="range" id="o-mus" min="0" max="1" step="0.05" value="${st.music}"></div>
      <div class="optrow"><label>Fondo animado</label><div class="seg" id="o-bg">${[['high', 'Alto'], ['low', 'Bajo'], ['off', 'No']].map(([v, n]) => `<button data-v="${v}" class="${st.bg === v ? 'on' : ''}">${n}</button>`).join('')}</div></div>
      <div class="optrow"><label>Temblor de pantalla</label><div class="seg" id="o-shake"><button data-v="1" class="${st.shake ? 'on' : ''}">Sí</button><button data-v="0" class="${!st.shake ? 'on' : ''}">No</button></div></div>

        ${inRun ? '<button class="btn ghost" data-a="how">Cómo se juega</button><button class="btn red" data-a="abandon">Abandonar partida</button><button class="btn ghost" data-a="menu">Menú principal</button>' : '<button class="btn red small" data-a="reset">Borrar todo el progreso</button>'}
      </div></div>`, { closable: true });
    const seg = (id, f) => o.querySelectorAll('#' + id + ' button').forEach((b) => b.onclick = () => { o.querySelectorAll('#' + id + ' button').forEach((x) => x.classList.remove('on')); b.classList.add('on'); f(b.dataset.v); BR.Meta.save(); cb('apply'); BR.Audio.sfx.select(); });
    seg('o-speed', (v) => st.speed = +v);

    seg('o-part', (v) => st.particles = v === '1');

    o.querySelector('#o-sfx').onchange = () => { BR.Meta.save(); BR.Audio.sfx.coinTick(); };
    o.querySelector('#o-mus').oninput = (e) => { st.music = +e.target.value; cb('apply'); };
    o.querySelector('#o-mus').onchange = () => BR.Meta.save();
    o.querySelectorAll('[data-a]').forEach((b) => b.onclick = () => { BR.Audio.sfx.button(); cb(b.dataset.a); });
  };

  S.confirm = function (title, text, yes, cb) {
    const o = S.open(`<div class="modal" style="width:min(420px,100%);text-align:center"><h2 style="font-size:24px">${title}</h2><p style="color:var(--muted)">${text}</p>
      <div class="row"><button class="btn ghost" data-a="no">Cancelar</button><button class="btn red" data-a="yes">${yes}</button></div></div>`, { closable: true });

  /* ---------------- información de la partida ---------------- */
  S.runInfo = function (g) {
    const rows = BR.HAND_ORDER.filter((h) => !BR.HANDS[h].secret || g.handLevels[h].played > 0).map((h) => {
      const H = BR.HANDS[h], L = g.handLevels[h];
      return `<tr><td class="lv">nv.${L.lvl}</td><td><b>${H.name}</b><div style="font-size:11px;color:var(--muted)">${BR.HAND_DESC[h]}</div></td><td><span class="hc">${H.chips + H.lc * (L.lvl - 1)}</span> × <span class="hm">${H.mult + H.lm * (L.lvl - 1)}</span></td><td class="hp">${L.played}×</td></tr>`;
    }).join('');
    const counts = {};
    for (const c of g.deck) { if (c.enh === 'piedra') continue; counts[c.suit + c.rank] = (counts[c.suit + c.rank] || 0) + 1; }
    const stones = g.deck.filter((c) => c.enh === 'piedra').length;
    let dl = '<div class="h"></div>' + BR.RANKS.map((r) => `<div class="h">${BR.RANK_INFO[r].short}</div>`).join('');
    for (const s of BR.SUITS) { dl += `<div class="h">${BR.Art.suitIcon(s, 16)}</div>` + BR.RANKS.map((r) => { const n = counts[s + r] || 0; return `<div class="n ${n ? '' : 'z'}">${n}</div>`; }).join(''); }
    const vouch = g.vouchers.map((v) => `<span class="tt-tag" style="--tc:#b8861a;cursor:help" data-tip="voucher:${v}">${BR.VOUCHER_BY_ID[v].name}</span>`).join(' ') || '<span style="color:var(--muted)">Ninguno todavía</span>';
    const tags = g.tags.map((t) => `<span class="tt-tag" style="--tc:#6a4ab0;cursor:help" data-tip="tagi:${t}">${BR.TAG_BY_ID[t].name}</span>`).join(' ') || '<span style="color:var(--muted)">Ninguna</span>';
    S.open(`<div class="modal" style="width:min(760px,100%)"><button class="close">×</button><h2>La partida</h2>
      <div class="subtitle">${BR.DECK_BY_ID[g.deckId].name} · ${BR.STAKES[g.stake].name} · Semilla <b style="color:var(--gold2);font-style:normal;letter-spacing:.1em">${g.seed}</b></div>
      <table class="handtable">${rows}</table>
      <h3 style="font-family:Cinzel;color:var(--gold2);margin:16px 0 8px">Tu baraja (${g.deck.length} naipes${stones ? ', ' + stones + ' de granito' : ''})</h3>
      <div class="decklist">${dl}</div>
      <h3 style="font-family:Cinzel;color:var(--gold2);margin:16px 0 8px">Privilegios</h3><div>${vouch}</div>
      <h3 style="font-family:Cinzel;color:var(--gold2);margin:16px 0 8px">Insignias pendientes</h3><div>${tags}</div>
    </div>`, { closable: true });
  };

  /* ---------------- cómo se juega ---------------- */
  const HOW = [
    ['La noche te desafía', `<p>Cada <b>Noche</b> tiene tres envites: el <b>Envite Menor</b>, el <b>Envite Mayor</b> y un <b>Guardián</b> con una regla maldita.</p><p>Para superar un envite debes alcanzar su <b>puntuación objetivo</b> antes de quedarte sin <b>Manos</b>. Vence a los 8 Guardianes y habrás ganado la partida.</p><p>Puedes <b>saltarte</b> el Envite Menor o el Mayor: no ganarás dinero, pero recibirás una <b>Insignia</b> con un premio.</p>`],
    ['Puntuar', `<p>Selecciona hasta <b>5 cartas</b> y juega una mano: Pareja, Trío, Escalera, Color, Full, Póker…</p><p>La puntuación es <span class="k-c">Fichas</span> × <span class="k-m">Mult</span>. Cada carta que puntúa suma sus fichas: <b>As 11, Tres 10, Rey 10, Caballo 9, Sota 8</b> y el resto su valor.</p><p>Usa los <b>Descartes</b> para cambiar cartas que no te sirvan.</p>`],
    ['La baraja española', `<p>Juegas con <b>40 naipes</b>: Oros, Copas, Espadas y Bastos, del As al Siete más Sota, Caballo y Rey.</p><p>Las <b>Escaleras</b> siguen el orden A·2·3·4·5·6·7·Sota·Caballo·Rey·A. El As puede ir al principio o al final.</p><p>Fíjate en los cortes del marco: igual que en los naipes tradicionales, indican el palo.</p>`],
    ['Triunfo y Cantes', `<p>Cada ronda se muestra un <b>palo de Triunfo</b>. Sus cartas dan <span class="k-m">+1 Mult</span> extra al puntuar.</p><p>Si juegas el <b>Caballo y el Rey</b> del mismo palo, <b>cantas Las Veinte</b>: <span class="k-c">+20 Fichas</span>. Si es en el palo de Triunfo… <b>¡Las Cuarenta!</b> <span class="k-c">+40 Fichas</span>.</p><p>Muchos talismanes se alimentan del Triunfo y de los cantes.</p>`],
    ['La Feria', `<p>Tras cada envite visitas <b>La Feria</b>. Allí encontrarás:</p><p>• <b>Talismanes</b>: efectos permanentes. ¡Su orden importa! Arrástralos para reordenarlos.<br>• <b>Augurios</b>: transforman tus cartas.<br>• <b>Constelaciones</b>: suben de nivel un tipo de mano.<br>• <b>Sobres</b> y <b>Privilegios</b>.</p><p>Ahorra: ganas <span class="k-d">$1</span> de interés por cada <span class="k-d">$5</span> (máx. $5).</p>`],
    ['Consejos', `<p>Busca una estrategia: una mano favorita, un palo, figuras… y elige talismanes que se potencien entre sí.</p><p>Los efectos <span class="k-x">×Mult</span> son los más poderosos: colócalos a la <b>derecha</b> para que multipliquen todo lo anterior.</p><p><b>Atajos</b>: <b>Enter</b> jugar · <b>X</b> descartar · <b>R</b>/<b>P</b> ordenar por valor/palo · <b>Esc</b> opciones.</p>`],
  ];
  S.howto = function (done) {
    let p = 0;
    const o = S.open(`<div class="modal" style="width:min(560px,100%)"><button class="close">×</button><h2 id="h-t"></h2><div class="howto" id="h-b"></div>
      <div class="pager"><button class="btn ghost small" id="h-prev">Anterior</button><div class="dots" id="h-d"></div><button class="btn play small" id="h-next">Siguiente</button></div></div>`, { closable: true });
    S.onClose = done || null;
    const draw = () => {
      o.querySelector('#h-t').textContent = HOW[p][0];
      o.querySelector('#h-b').innerHTML = HOW[p][1];
      o.querySelector('#h-d').innerHTML = HOW.map((_, i) => `<i class="${i === p ? 'on' : ''}"></i>`).join('');
      o.querySelector('#h-prev').style.visibility = p ? 'visible' : 'hidden';
      o.querySelector('#h-next').textContent = p === HOW.length - 1 ? '¡Entendido!' : 'Siguiente';
    };
    o.querySelector('#h-prev').onclick = () => { p = Math.max(0, p - 1); BR.Audio.sfx.flip(); draw(); };
    o.querySelector('#h-next').onclick = () => { if (p === HOW.length - 1) { BR.Audio.sfx.button(); S.close(); return; } p++; BR.Audio.sfx.flip(); draw(); };
    draw();
  };

  /* ---------------- fin de partida ---------------- */
  S.endScreen = function (g, won, unlocks, cb) {
    const fav = Object.entries(g.handLevels).sort((a, b) => b[1].played - a[1].played)[0];
    const o = S.open(`<div class="modal" style="width:min(600px,100%);text-align:center">
      <h2 style="${won ? '' : 'color:#ffb0b8'}">${won ? '¡Has vencido a la Noche!' : 'La noche te ha vencido'}</h2>
      <div class="subtitle">${won ? 'Las estrellas cantan tu nombre. ¿Te atreves a seguir jugando?' : 'Las cartas se barajan de nuevo. La próxima noche será tuya.'}</div>
      <div class="statgrid">
        <div class="s"><div class="v">${BR.fmt(g.counts.best)}</div><div class="l">Mejor mano</div></div>
        <div class="s"><div class="v">${g.ante}</div><div class="l">Noche</div></div>
        <div class="s"><div class="v">${fav && fav[1].played ? BR.HANDS[fav[0]].name : '—'}</div><div class="l">Mano más jugada</div></div>
        <div class="s"><div class="v">${g.counts.hands}</div><div class="l">Manos jugadas</div></div>
        <div class="s"><div class="v">${g.counts.cuarenta}</div><div class="l">Las Cuarenta</div></div>
        <div class="s"><div class="v" style="letter-spacing:.1em">${g.seed}</div><div class="l">Semilla</div></div>
      </div>
      ${unlocks && unlocks.length ? `<div style="margin-top:14px;color:var(--gold2);font-weight:700">${unlocks.map((u) => '✦ ' + u.text).join('<br>')}</div>` : ''}
      <div class="row">${won ? '<button class="btn gold" data-a="endless">Seguir jugando (infinito)</button>' : ''}<button class="btn play" data-a="new">Nueva partida</button><button class="btn ghost" data-a="menu">Menú</button></div></div>`);
    o.querySelectorAll('[data-a]').forEach((b) => b.onclick = () => { BR.Audio.sfx.button(); cb(b.dataset.a); });
  };

  BR.Screens = S;
})(globalThis.BR = globalThis.BR || {});

</script>
<script>
/* BRISKA — controlador principal: une el núcleo, la vista y las pantallas */
(function (BR) {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const V = BR.View, S = BR.Screens, FX = BR.FX, AU = BR.Audio, Meta = BR.Meta;
  const UI = { spawnFrom: {}, g: null, sel: [], packSel: [], selTal: null, selCons: null, selShop: null, busy: false, drag: null, flip: new Set(), scoring: null, touch: false, cw: 96, ch: 134 };
  BR.UI = UI;
  BR.speedMult = 1;
  Object.defineProperty(BR, 'uiBusy', { get: () => UI.busy });

  const wait = (ms) => new Promise((r) => setTimeout(r, ms / BR.speedMult));
  const S$ = () => Meta.data.settings;

  function applySettings() {
    const s = S$();
    BR.speedMult = [1, 1, 1.6, 2.4, 3.4][s.speed] || 1.6;
    document.documentElement.style.setProperty('--speed', BR.speedMult);
    AU.setVolumes(s.sfx, s.music);
    BR.BG.setQuality(s.bg);
    FX.opts.shake = s.shake; FX.opts.particles = s.particles;
  }

  /* ======================= tamaños y disposición ======================= */
  const MOBILE_Q = matchMedia('(max-width: 720px), (orientation: portrait) and (max-width: 1100px)');
  const isMobile = () => MOBILE_Q.matches;
  function computeSize() {
    const mobile = isMobile();
    let cw;
    if (mobile) cw = Math.min((innerWidth - 16) / 5.3, innerHeight / 8.2);
    else {
      const side = BR.clamp(innerWidth * 0.2, 230, 300);
      const mw = innerWidth - side - 42;
      cw = Math.min(mw / 9.4, (innerHeight - 40) / 6.5, 132);
    }
    cw = Math.max(42, Math.floor(cw));
    document.documentElement.style.setProperty('--cw', cw + 'px');
    UI.cw = cw; UI.ch = Math.round(cw * 1.4);
  }
  const zr = (id) => $(id).getBoundingClientRect();
  function rowLayout(rect, n, w, h, opts = {}) {
    const gap = opts.gap != null ? opts.gap : w * 0.14;
    let step = w + gap;
    if (n > 1 && step * (n - 1) + w > rect.width) step = (rect.width - w) / (n - 1);
    const total = n ? step * (n - 1) + w : 0;
    const x0 = rect.left + (opts.align === 'left' ? 0 : (rect.width - total) / 2);
    const y = rect.top + (rect.height - h) / 2;
    return Array.from({ length: n }, (_, i) => ({ x: x0 + i * step, y }));
  }
  function handLayout(rect, n) {
    const pos = rowLayout(rect, n, UI.cw, UI.ch, { gap: UI.cw * 0.05 });
    return pos.map((p, i) => {
      const t = n > 1 ? i / (n - 1) - 0.5 : 0;
      return { x: p.x, y: p.y + t * t * UI.ch * 0.16 + UI.ch * 0.04, rot: t * Math.min(16, n * 1.7) };
    });
  }
  function deckPos() { const r = zr('z-deck'); return { x: r.left + (r.width - UI.cw) / 2, y: r.top + (r.height - UI.ch) / 2 }; }

  /* ======================= render ======================= */
  function render() {
    const g = UI.g;
    if (!g) { V.sync([]); return; }
    updateSide();
    const app = $('app');
    app.className = 'phase-' + g.phase + (g.phase === 'pack' && !(g.pack && g.pack.hand) ? ' nohand' : '');
    const D = [];
    const cw = UI.cw, ch = UI.ch;
    const cardTip = (c) => () => S.tipHTML('card', c, g);

    // talismanes
    {
      const order = UI.drag && UI.drag.group === 'tal' ? UI.drag.order : g.talismans.map((t) => t.uid);
      const pos = rowLayout(zr('z-tal'), order.length, cw, ch);
      order.forEach((uid, i) => {
        const t = g.talismans.find((x) => x.uid === uid); if (!t) return;
        D.push({ key: uid, kind: 'tal', obj: t, x: pos[i].x, y: pos[i].y, z: 10 + i, from: UI.spawnFrom[uid],
          cls: (UI.selTal === uid ? 'sel' : '') + (t._disabled ? ' disabled-tal' : ''),
          drag: 'tal', onClick: () => clickTal(uid), tip: () => S.tipHTML('tal', t, g) });
      });
      const full = g.talismans.length >= g.talSlots();
      $('tal-count').innerHTML = `<span class="${full ? 'full' : ''}">${g.talismans.length}/${g.talSlots()}</span>`;
    }
    // consumibles
    {
      const pos = rowLayout(zr('z-cons'), g.consumables.length, cw, ch, { gap: cw * 0.08 });
      g.consumables.forEach((k, i) => {
        D.push({ key: k.uid, kind: 'cons', obj: k, x: pos[i].x, y: pos[i].y, z: 10 + i, from: UI.spawnFrom[k.uid], cls: UI.selCons === k.uid ? 'sel' : '',
          onClick: () => clickCons(k.uid), tip: () => S.tipHTML('cons', k, g) });
      });
      $('cons-count').innerHTML = `<span class="${g.consumables.length >= g.consSlots() ? 'full' : ''}">${g.consumables.length}/${g.consSlots()}</span>`;
    }
    // mazo
    const showDeck = g.phase === 'round' || (g.phase === 'pack' && g.pack && g.pack.hand);
    if (showDeck && !isMobile()) {
      const p = deckPos();
      const sc = 1;
      D.push({ key: 'deck', kind: 'deck', obj: {}, x: p.x - (cw - cw * sc) / 2, y: p.y - (ch - ch * sc) / 2, scale: sc, z: 5, onClick: () => { AU.sfx.button(); S.runInfo(g); }, tip: () => `<div class="tt-title">Mazo</div><div class="tt-body">${g.phase === 'round' ? g.drawPile.length : g.deck.length} cartas por robar de ${g.deck.length}</div>` });
    }
    const dp = deckPos();
    // mano
    if (g.phase === 'round' || (g.phase === 'pack' && g.pack && g.pack.hand)) {
      const handIds = g.phase === 'round' ? g.hand : g.pack.hand;
      const order = UI.drag && UI.drag.group === 'hand' ? UI.drag.order : handIds;
      const pos = handLayout(zr('z-hand'), order.length);
      const selArr = g.phase === 'round' ? UI.sel : UI.packSel;
      order.forEach((id, i) => {
        const c = g.card(id); if (!c) return;
        const debuff = g.phase === 'round' && g.isDebuffed(c);
        let cls = selArr.includes(id) ? 'sel' : '';
        if (c._down || UI.flip.has(id)) cls += ' down';
        if (debuff) cls += ' debuff';
        D.push({ key: id, kind: 'card', obj: c, x: pos[i].x, y: pos[i].y, rot: pos[i].rot, z: 30 + i, cls,
          from: { x: dp.x, y: dp.y, rot: 0, down: true }, delay: UI.dealDelay ? UI.dealDelay(id) : 0,
          drag: 'hand', onClick: () => clickHandCard(id), tip: c._down ? null : cardTip(c) });
      });
    }
    // jugadas
    if (g.phase === 'round' && g.played.length) {
      const pos = rowLayout(zr('z-play'), g.played.length, cw, ch, { gap: cw * 0.12 });
      g.played.forEach((id, i) => {
        const c = g.card(id); if (!c) return;
        let cls = '';
        if (UI.scoring) cls = UI.scoring.has(id) ? 'raise' : 'dim';
        if (c._debuffed) cls += ' debuff';
        D.push({ key: id, kind: 'card', obj: c, x: pos[i].x, y: pos[i].y, z: 60 + i, cls, tip: cardTip(c) });
      });
    }
    // feria
    if (g.phase === 'shop' && g.shop) {
      const items = g.shop.items.map((it, i) => ({ it, i })).filter((x) => x.it);
      const pos = rowLayout(zr('z-shop'), items.length, cw, ch, { gap: cw * 0.35 });
      items.forEach(({ it, i }, k) => {
        const key = 'shop' + i + '_' + it.kind + it.id;
        const obj = it.kind === 'tal' ? { id: it.id, ed: it.ed, st: BR.TAL_BY_ID[it.id].init ? BR.TAL_BY_ID[it.id].init() : {} } : { type: it.kind, id: it.id };
        const cost = g.itemCost(it);
        D.push({ key, kind: it.kind === 'tal' ? 'tal' : 'cons', obj, x: pos[k].x, y: pos[k].y + 12, z: 20 + k, price: cost,
          cls: (UI.selShop === key ? 'sel' : '') + (g.canAfford(cost) ? '' : ' cant'),
          onClick: () => clickShop(key, 'items', i), tip: () => S.tipHTML(it.kind === 'tal' ? 'tal' : 'cons', obj, g) });
      });
      if (g.shop.voucher) {
        const r = zr('z-voucher'); const v = g.shop.voucher; const key = 'vou_' + v.id; const cost = g.itemCost(v);
        D.push({ key, kind: 'voucher', obj: v, x: r.left + (r.width - cw) / 2, y: r.top + (r.height - ch) / 2 + 12, z: 20, price: cost,
          cls: (UI.selShop === key ? 'sel' : '') + (g.canAfford(cost) ? '' : ' cant'), onClick: () => clickShop(key, 'voucher', 0), tip: () => S.tipHTML('voucher', v, g) });
      }
      const packs = g.shop.packs.map((p, i) => ({ p, i })).filter((x) => x.p);
      const pp = rowLayout(zr('z-packs'), packs.length, cw, ch, { gap: cw * 0.5 });
      packs.forEach(({ p, i }, k) => {
        const key = 'pack' + i + '_' + p.pack + p.size; const cost = g.itemCost(p);
        D.push({ key, kind: 'pack', obj: p, x: pp[k].x, y: pp[k].y + 12, z: 20 + k, price: cost,
          cls: (UI.selShop === key ? 'sel' : '') + (g.canAfford(cost) ? '' : ' cant'), onClick: () => clickShop(key, 'packs', i), tip: () => S.tipHTML('pack', p, g) });
      });
    }
    // sobre
    if (g.phase === 'pack' && g.pack) {
      const ch2 = g.pack.choices.map((c, i) => ({ c, i })).filter((x) => x.c);
      const pos = rowLayout(zr('z-pack'), ch2.length, cw, ch, { gap: cw * 0.3 });
      ch2.forEach(({ c }, k) => {
        const key = c.key;
        let kind = 'cons', obj;
        if (c.kind === 'tal') { kind = 'tal'; obj = { id: c.id, ed: c.ed, st: BR.TAL_BY_ID[c.id].init ? BR.TAL_BY_ID[c.id].init() : {} }; }
        else if (c.kind === 'card') { kind = 'card'; obj = c; }
        else obj = { type: c.kind, id: c.id };
        D.push({ key, kind, obj, x: pos[k].x, y: pos[k].y, z: 40 + k, cls: UI.selShop === key ? 'sel' : '',
          from: { x: pos[k].x, y: pos[k].y + 80, scale: 0.3 },
          onClick: () => clickPackChoice(key), tip: () => S.tipHTML(kind === 'card' ? 'card' : kind, obj, g) });
      });
    }
    V.sync(D);
    UI.spawnFrom = {};
    const showHint = g.phase === 'round' && Meta.data.stats.hands < 2 && !UI.sel.length && !UI.busy && !g.played.length;
    const hint = $('hint');
    if (hint) { hint.classList.toggle('show', showHint); }
    if (UI.hoverKey && !V.sprites.has(UI.hoverKey)) { S.hideTip(); UI.hoverKey = null; }
  }

  /* ======================= barra lateral ======================= */
  function updateSide() {
    const g = UI.g;
    const kind = g.blindKind(Math.min(2, g.blindIdx));
    const inRound = g.phase === 'round' && g.r;
    let name, color, medal, desc = '';
    const bk = inRound ? g.r.kind : kind;
    if (bk === 'boss') {
      const b = BR.BOSS_BY_ID[g.bossId];
      name = b.name; color = b.color; medal = BR.Art.bossMedal(g.bossId);
      desc = g.talFlags().noBoss && inRound ? '<s>' + BR.rich(b.desc) + '</s> (Rompehechizos)' : BR.rich(b.desc);
    } else { name = BR.RIVALS[bk].name; color = BR.RIVALS[bk].color; medal = BR.Art.blindMedal(bk); }
    if (g.phase === 'shop') { name = 'La Feria'; color = '#a8322e'; }
    $('blindbox').style.setProperty('--bbc', color);
    setHTML('bb-name', name);
    setHTML('bb-medal', g.phase === 'shop' ? `<div class="medal" style="--mc:#c0503a">${BR.icon('stall')}</div>` : medal);
    let target = inRound ? g.r.target : g.blindTarget(Math.min(2, g.blindIdx));
    let rew = inRound ? g.blindReward() : g.blindReward(Math.min(2, g.blindIdx));
    if (g.phase === 'shop') {
      if (g.blindIdx < 2) { target = g.blindTarget(g.blindIdx + 1); rew = g.blindReward(g.blindIdx + 1); }
      else { target = Math.floor(BR.anteBase(g.ante + 1, g.stake) * (g.flags.targetMult || 1)); rew = g.stake >= 1 ? 0 : 3; }
    }
    setHTML('bb-target', BR.fmt(target));
    setHTML('bb-reward', rew ? 'Recompensa: ' + (rew <= 5 ? '$'.repeat(rew) : '$' + rew) : 'Sin recompensa');
    setHTML('bb-desc', g.phase === 'shop' ? 'Próximo: ' + (g.blindIdx === 2 ? 'Noche ' + (g.ante + 1) : BR.RIVALS[g.blindKind(g.blindIdx + 1)]?.name || BR.BOSS_BY_ID[g.bossId].name) : desc);
    if (!UI.animScore) {
      const sc = inRound ? g.r.score : 0;
      setHTML('round-score', BR.fmt(sc));
      $('score-fill').style.width = (inRound ? Math.min(100, (sc / g.r.target) * 100) : 0) + '%';
      $('scorebox').classList.toggle('done', inRound && sc >= g.r.target);
    }
    setHTML('st-hands', inRound ? g.r.handsLeft : g.handsPerRound());
    setHTML('st-discards', inRound ? g.r.discardsLeft : g.discardsPerRound());
    if (!UI.animMoney) setHTML('st-money', (g.money < 0 ? '-$' : '$') + Math.abs(g.money));
    setHTML('st-ante', g.ante);
    $('st-ante').nextElementSibling.textContent = g.endless || g.ante > 8 ? '' : '/8';
    setHTML('st-round', (g.ante - 1) * 3 + Math.min(2, g.blindIdx) + 1);
    const tr = inRound ? g.r.trump : g.trumpLock ? g.trumpLock.suit : null;
    setHTML('st-trump', tr ? `${BR.Art.suitIcon(tr, 26)}<span>${BR.SUIT_INFO[tr].name}</span>` : '<span style="opacity:.5">—</span>');
    setHTML('deck-count', inRound ? `${g.drawPile.length}/${g.deck.length}` : `${g.deck.length}/${g.deck.length}`);
    if (!UI.animScore && !UI.busy) updatePreview();
    const sel = UI.sel.length;
    $('btn-play').disabled = !(inRound && sel > 0 && sel <= 5 && g.r.handsLeft > 0) || UI.busy;
    $('btn-discard').disabled = !(inRound && sel > 0 && sel <= 5 && g.r.discardsLeft > 0) || UI.busy;
    if (g.shop) { const rc = g.rerollCostNow(); setHTML('reroll-cost', rc === 0 ? 'gratis' : '$' + rc); $('btn-reroll').disabled = !g.canAfford(rc); }
    // panel de fase
    if (g.phase === 'blind') renderBlindSelect();
    if (g.phase === 'pack' && g.pack) {
      const K = BR.PACK_KINDS[g.pack.kind];
      setHTML('pack-title', (BR.PACK_SIZES[g.pack.size].name ? BR.PACK_SIZES[g.pack.size].name + ' ' : '') + K.name);
      const needSel = g.pack.hand ? ' · selecciona cartas de tu mano si el efecto lo pide' : '';
      setHTML('pack-sub', `Elige ${g.pack.picks} más${needSel}`);
    }
  }
  function setHTML(id, html) { const el = $(id); if (el && el._h !== html) { el.innerHTML = html; el._h = html; } }

  function updatePreview() {
    const g = UI.g;
    const hn = $('hand-name');
    hn.classList.remove('blocked');
    if (g.phase === 'round' && UI.sel.length) {
      const p = g.previewHand(UI.sel);
      if (p) {
        hn.innerHTML = `${BR.HANDS[p.type].name}<small>nv.${p.level}</small>${p.cante ? `<small class="cantetag">${p.cante === 'cuarenta' ? '¡Las 40!' : '¡Las 20!'}</small>` : ''}`;
        if (p.blocked) { hn.classList.add('blocked'); hn.innerHTML = '⚠ ' + p.blocked; }
        setChipsMult(p.chips, p.mult);
        return;
      }
    }
    hn.innerHTML = '&nbsp;';
    setChipsMult(0, 0);
  }
  function setChipsMult(c, m, bump) {
    const cv = $('chips-val'), mv = $('mult-val');
    const ct = BR.fmt(c), mt = BR.fmtNum(m);
    if (cv.textContent !== ct) { cv.textContent = ct; if (bump === 'c') bumpEl('chips-box'); }
    if (mv.textContent !== mt) { mv.textContent = mt; if (bump === 'm') bumpEl('mult-box'); }
  }
  function bumpEl(id) { const e = $(id); e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); }
  function flashEl(id) { const e = $(id); e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); }

  /* ======================= selección de envite ======================= */
  function renderBlindSelect() {
    const g = UI.g;
    const el = $('blindsel');
    const sig = [g.ante, g.blindIdx, g.bossId, g.blindTags.join(), g.money].join('|');
    if (el._sig === sig) return;
    el._sig = sig;
    const cols = [0, 1, 2].map((i) => {
      const kind = g.blindKind(i);
      const isBoss = kind === 'boss';
      const b = isBoss ? BR.BOSS_BY_ID[g.bossId] : null;
      const color = isBoss ? b.color : BR.RIVALS[kind].color;
      const name = isBoss ? b.name : BR.RIVALS[kind].name;
      const state = i < g.blindIdx ? 'past' : i === g.blindIdx ? 'current' : 'future';
      const rew = g.blindReward(i);
      const medal = isBoss ? `<div data-tip="boss:${b.id}">${BR.Art.bossMedal(b.id)}</div>` : BR.Art.blindMedal(kind);
      let foot = '';
      if (!isBoss) {
        const tg = g.blindTags[i];
        foot = state === 'current' ? `<div class="bskip"><div data-tip="tagi:${tg}">${BR.Art.tagHTML(tg)}</div><span class="or">o</span><button class="btn ghost small" data-act="skip">Saltar envite</button></div>`
          : state === 'future' ? `<div class="bskip"><div data-tip="tagi:${tg}">${BR.Art.tagHTML(tg)}</div><span class="or">si lo saltas</span></div>` : '';
      }
      return `<div class="bcol ${state}" style="--bcc:${color}">
        <div class="bh">${name}</div>
        <div class="bbody">
          ${medal}
          <div class="lbl">Objetivo</div>
          <div class="btarget">${BR.fmt(g.blindTarget(i))}</div>
          <div class="reward">${rew ? (rew <= 5 ? '$'.repeat(rew) : '$' + rew) : 'Sin recompensa'}</div>
          <div class="bdesc">${isBoss ? BR.rich(b.desc) : i === 0 ? 'Un primer envite para calentar las manos.' : 'La apuesta sube. Demuestra lo que vales.'}</div>
          ${state === 'current' ? '<button class="btn play" data-act="select">Elegir</button>' : state === 'past' ? '<div class="done-mark">' + (g.skippedIdx && g.skippedIdx.includes(g.ante + ':' + i) ? 'SALTADO' : 'SUPERADO') + '</div>' : '<div class="done-mark" style="opacity:.6">PRÓXIMO</div>'}
        </div>${foot}</div>`;
    });
    el.innerHTML = cols.join('');
    el.querySelectorAll('[data-act]').forEach((b) => b.onclick = () => (b.dataset.act === 'select' ? selectBlind() : skipBlind()));
  }

  async function selectBlind() {
    const g = UI.g;
    if (UI.busy || g.phase !== 'blind') return;
    AU.sfx.button();
    UI.busy = true;
    const ev = g.selectBlind();
    UI.sel = [];
    setMood();
    if (g.r.kind === 'boss') { AU.sfx.boss(); banner(BR.BOSS_BY_ID[g.bossId].name, 'red', BR.BOSS_BY_ID[g.bossId].desc.replace(/\{[a-z$]([^}]*)\}/gi, '$1')); FX.shake(5, 400); }
    AU.sfx.shuffle();
    const order = g.hand.slice();
    UI.dealDelay = (id) => { const i = order.indexOf(id); return i >= 0 ? i * 70 : 0; };
    render();
    order.forEach((_, i) => setTimeout(() => AU.sfx.deal(), i * 70 / BR.speedMult));
    UI.dealDelay = null;
    showEvents(ev);
    await wait(500);
    UI.busy = false;
    render();
    save();
  }
  function skipBlind() {
    const g = UI.g;
    if (UI.busy || g.phase !== 'blind') return;
    (g.skippedIdx = g.skippedIdx || []).push(g.ante + ':' + g.blindIdx);
    const res = g.skipBlind();
    if (!res) return;
    AU.sfx.levelup();
    const t = BR.TAG_BY_ID[res.tag];
    S.toast(`✦ ${t.name}: ${BR.rich(t.desc)}`, 'unlock');
    if (res.money) { moneyPop(res.money); }
    for (const x of res.extra) { const tt = BR.TAG_BY_ID[x.tag]; S.toast(`✦ Copia: ${tt.name}`, 'unlock'); }
    if (g.openPendingPack('blind')) { AU.sfx.pack(); }
    ach({ type: 'tick' });
    render(); save();
  }

  /* ======================= interacción ======================= */
  function clickHandCard(id) {
    const g = UI.g;
    if (UI.busy) return;
    hideActions();
    if (g.phase === 'round') {
      const i = UI.sel.indexOf(id);
      if (i >= 0) { UI.sel.splice(i, 1); AU.sfx.deselect(); }
      else if (UI.sel.length < 5) { UI.sel.push(id); AU.sfx.select(); }
      else { AU.sfx.error(); V.shakeIt(id); return; }
      render();
      if (UI.selCons) showConsActions(UI.selCons);
    } else if (g.phase === 'pack') {
      const i = UI.packSel.indexOf(id);
      if (i >= 0) { UI.packSel.splice(i, 1); AU.sfx.deselect(); }
      else if (UI.packSel.length < 5) { UI.packSel.push(id); AU.sfx.select(); }
      render();
      if (UI.selShop) showPackActions(UI.selShop);
    }
  }
  function clickTal(uid) {
    if (UI.busy) return;
    UI.selCons = null; UI.selShop = null;
    if (UI.selTal === uid) { UI.selTal = null; hideActions(); AU.sfx.deselect(); render(); return; }
    UI.selTal = uid; AU.sfx.select(); render();
    const t = UI.g.talismans.find((x) => x.uid === uid);
    showActions(uid, [{ label: `Vender <b>$${UI.g.sellValue(t)}</b>`, cls: 'green', fn: () => sellTal(uid) }]);
  }
  function clickCons(uid) {
    if (UI.busy) return;
    UI.selTal = null; UI.selShop = null;
    if (UI.selCons === uid) { UI.selCons = null; hideActions(); AU.sfx.deselect(); render(); return; }
    UI.selCons = uid; AU.sfx.select(); render();
    showConsActions(uid);
  }
  function showConsActions(uid) {
    const g = UI.g;
    const k = g.consumables.find((x) => x.uid === uid); if (!k) return;
    const sel = g.phase === 'pack' ? UI.packSel : UI.sel;
    const ok = g.canUse(k, sel);
    const d = BR.consDef(k);
    let hint = '';
    if (!ok && d.sel) hint = d.sel[0] === d.sel[1] ? `Selecciona ${d.sel[0]} carta${d.sel[0] > 1 ? 's' : ''}` : `Selecciona de ${d.sel[0]} a ${d.sel[1]} cartas`;
    if (d.sel && g.phase !== 'round' && g.phase !== 'pack') hint = 'Úsalo durante una ronda';
    showActions(uid, [
      { label: hint || 'Usar', cls: 'blue', disabled: !ok, fn: () => useCons(uid) },
      { label: `Vender <b>$${g.sellValue(k)}</b>`, cls: 'green', fn: () => sellCons(uid) },
    ]);
  }
  function clickShop(key, where, idx) {
    if (UI.busy) return;
    const g = UI.g;
    UI.selTal = null; UI.selCons = null;
    if (UI.selShop === key) { UI.selShop = null; hideActions(); render(); return; }
    UI.selShop = key; AU.sfx.select(); render();
    const it = where === 'items' ? g.shop.items[idx] : where === 'packs' ? g.shop.packs[idx] : g.shop.voucher;
    const cost = g.itemCost(it);
    const label = where === 'packs' ? 'Abrir' : where === 'voucher' ? 'Canjear' : 'Comprar';
    let noRoom = null;
    if (it.kind === 'tal' && g.talismans.length >= g.talSlots() && it.ed !== 'eclipse') noRoom = 'Sin huecos: vende un Talismán';
    if ((it.kind === 'aug' || it.kind === 'con' || it.kind === 'ani') && g.consSpace() <= 0) noRoom = 'Sin huecos de consumible';
    const acts = [{ label: noRoom || (!g.canAfford(cost) ? `Te faltan <b>$${cost - g.money - g.debtLimit()}</b>` : `${label} <b>${cost ? '$' + cost : 'gratis'}</b>`), cls: 'gold', disabled: !g.canAfford(cost) || !!noRoom, fn: () => buy(where, idx, key) }];
    if (where === 'items' && it.kind !== 'tal') {
      const d = BR.consDef({ type: it.kind, id: it.id });
      if (!d.sel) acts.push({ label: 'Comprar y usar', cls: 'blue', disabled: !g.canAfford(cost) || (d.can && !d.can(g)), fn: () => buy(where, idx, key, true) });
    }
    showActions(key, acts);
  }
  function clickPackChoice(key) {
    if (UI.busy) return;
    UI.selTal = null; UI.selCons = null;
    if (UI.selShop === key) { UI.selShop = null; hideActions(); render(); return; }
    UI.selShop = key; AU.sfx.select(); render();
    showPackActions(key);
  }
  function showPackActions(key) {
    const g = UI.g;
    const c = g.pack.choices.find((x) => x && x.key === key); if (!c) return;
    let ok = true, label = 'Elegir', hint = '';
    if (c.kind === 'tal') { ok = g.talismans.length < g.talSlots() || c.ed === 'eclipse'; if (!ok) hint = 'Sin huecos de Talismán'; }
    else if (c.kind === 'aug' || c.kind === 'ani' || c.kind === 'con') {
      label = 'Usar';
      const d = BR.consDef({ type: c.kind, id: c.id });
      ok = g.canUse({ type: c.kind, id: c.id }, UI.packSel);
      if (!ok && d.sel) hint = d.sel[0] === d.sel[1] ? `Selecciona ${d.sel[0]} carta${d.sel[0] > 1 ? 's' : ''}` : `Selecciona de ${d.sel[0]} a ${d.sel[1]} cartas`;
      else if (!ok) hint = 'No se puede usar ahora';
    }
    showActions(key, [{ label: hint || label, cls: 'gold', disabled: !ok, fn: () => pickPack(key) }]);
  }

  function showActions(key, acts) {
    const am = $('actionmenu');
    am.innerHTML = '';
    for (const a of acts) {
      const b = document.createElement('button');
      b.className = 'btn small ' + (a.cls || '');
      b.innerHTML = a.label; b.disabled = !!a.disabled;
      b.onclick = (e) => { e.stopPropagation(); if (b.disabled) return; hideActions(); a.fn(); };
      am.appendChild(b);
    }
    am.classList.add('show');
    const r = V.rect(key);
    if (!r) return;
    const w = am.offsetWidth, h = am.offsetHeight;
    let x = r.left + r.width / 2 - w / 2, y = r.bottom + 8;
    if (y + h > innerHeight - 6) y = r.top - h - 8;
    am.style.left = BR.clamp(x, 6, innerWidth - w - 6) + 'px';
    am.style.top = Math.max(6, y) + 'px';
    if (UI.touch) { const s = V.sprites.get(key); if (s && s.desc.tip) S.showTip(s.desc.tip(), r, y < r.top ? 'below' : 'above'); }
  }
  function hideActions() { $('actionmenu').classList.remove('show'); if (UI.touch) S.hideTip(); }
  function clearSelections() { UI.selTal = null; UI.selCons = null; UI.selShop = null; hideActions(); }

  /* ======================= jugar y descartar ======================= */
  async function playHand() {
    const g = UI.g;
    if (UI.busy || g.phase !== 'round' || !UI.sel.length) return;
    clearSelections();
    const ids = g.hand.filter((id) => UI.sel.includes(id));
    UI.busy = true;
    AU.sfx.whoosh();
    const res = g.playHand(ids);
    UI.sel = [];
    if (!res) { UI.busy = false; render(); return; }
    render();
    await wait(480);
    await animateScoring(res);
    await finishPlay(res);
  }

  function srcPos(src) {
    if (!src) return null;
    if (src.t === 'card' || src.t === 'held') { const r = V.rect(src.id); return r ? [r.left + r.width / 2, r.top + r.height * 0.12] : null; }
    if (src.t === 'tal' || src.t === 'cons') { const r = V.rect(src.id); return r ? [r.left + r.width / 2, r.bottom - r.height * 0.05] : null; }
    if (src.t === 'boss') return FX.center($('bb-medal'));
    return FX.center($('handbox'));
  }
  function jigSrc(src) {
    if (!src) return;
    if (src.t === 'card' || src.t === 'held' || src.t === 'tal' || src.t === 'cons') V.jig(src.id);
    if (src.card) V.jig(src.card);
  }

  async function animateScoring(res) {
    const g = UI.g;
    UI.animScore = true;
    UI.scoring = new Set(res.scoringIds);
    render();
    const hn = $('hand-name');
    let pitch = 0, i = 0;
    const startScore = g.r.score - res.total;
    for (const st of res.steps) {
      const d = Math.max(130, 400 * Math.pow(0.955, i)); i++;
      const pos = srcPos(st.src) || FX.center($('handbox'));
      switch (st.kind) {
        case 'blocked':
          hn.classList.add('blocked'); hn.textContent = '⚠ ' + st.text; AU.sfx.error(); FX.shake(6, 300);
          banner('¡No permitido!', 'red', st.text);
          V.shakeIt('dummy');
          await wait(1100); break;
        case 'base': {
          hn.innerHTML = `${BR.HANDS[st.type].name}<small>nv.${st.level}</small>`;
          const pc = FX.center($('z-play'));
          FX.pop(pc[0], pc[1] - UI.ch * 0.78, BR.HANDS[st.type].name, 'msg', { cls: 'handtitle', dur: 1400 });
          setChipsMult(st.chips, st.mult); bumpEl('chips-box'); bumpEl('mult-box');
          AU.sfx.tick(); await wait(380); break;
        }
        case 'cante': {
          setChipsMult(st.chips, st.mult, 'c');
          AU.sfx.cante(); BR.BG.pulse(0.8);
          banner(st.cante === 'cuarenta' ? '¡Las Cuarenta!' : '¡Las Veinte!', st.cante === 'cuarenta' ? '' : 'blue', st.cante === 'cuarenta' ? 'Caballo y Rey del palo de Triunfo' : 'Caballo y Rey del mismo palo');
          FX.pop(pos[0], pos[1] - 20, '+' + st.value, 'chips', { big: true });
          if (st.cante === 'cuarenta') FX.shake(7, 400);
          await wait(1000); break;
        }
        case 'chips':
          jigSrc(st.src); FX.pop(pos[0], pos[1], '+' + BR.fmt(st.value), 'chips'); setChipsMult(st.chips, st.mult, 'c');
          AU.sfx.chips(pitch++); await wait(d); break;
        case 'mult':
          jigSrc(st.src); FX.pop(pos[0], pos[1], '+' + BR.fmtNum(st.value) + (st.trump ? ' Triunfo' : ' Mult'), 'mult', { cls: st.trump ? 'small' : '' }); setChipsMult(st.chips, st.mult, 'm');
          AU.sfx.mult(pitch++); await wait(d); break;
        case 'xmult':
          jigSrc(st.src); FX.pop(pos[0], pos[1], '×' + BR.fmtNum(st.value) + ' Mult', 'xmult'); setChipsMult(st.chips, st.mult, 'm');
          AU.sfx.xmult(pitch++); FX.shake(4 + Math.min(6, st.value), 260); BR.BG.pulse(0.4); FX.ring(pos[0], pos[1], '#ff6a7a', 90, 500, 5);
          await wait(d * 1.25); break;
        case 'money':
          jigSrc(st.src); FX.pop(pos[0], pos[1], (st.value < 0 ? '-$' : '+$') + Math.abs(st.value), 'money'); FX.coins(pos[0], pos[1], 6);
          AU.sfx.money(); flashEl('st-money'); setHTML('st-money', (g.money < 0 ? '-$' : '$') + Math.abs(g.money)); await wait(d); break;
        case 'retrigger':
          jigSrc(st.src); FX.pop(pos[0], pos[1] - 10, '¡Otra vez!', 'msg', { color: '#ffb0ff' }); AU.sfx.tick(); await wait(d * 0.8); break;
        case 'debuffed':
          V.shakeIt(st.src.id); FX.pop(pos[0], pos[1], 'Debilitada', 'msg', { color: '#ff8090' }); await wait(d * 0.8); break;
        case 'msg':
          jigSrc(st.src); FX.pop(pos[0], pos[1], st.text, 'msg', { color: st.color === 'm' ? '#ff8090' : st.color === 'c' ? '#8fc0ff' : st.color === 'x' ? '#ff9ad0' : null });
          AU.sfx.tick(); await wait(d * 0.9); break;
        case 'balance':
          FX.pop(pos[0], pos[1], 'Equilibrio', 'msg', { color: '#d0a8ff' }); setChipsMult(st.chips, st.mult); bumpEl('chips-box'); bumpEl('mult-box'); AU.sfx.levelup(); await wait(600); break;
        case 'total': {
          AU.sfx.total();
          const tEl = $('hand-total');
          tEl.textContent = BR.fmt(st.value); tEl.classList.add('show');
          const need = g.r.target - startScore;
          const fire = st.value >= need && st.value > 0;
          const pc = FX.center($('z-play'));
          FX.pop(pc[0], pc[1] - UI.ch * 0.75, BR.fmt(st.value), 'msg', { big: true, color: fire ? '#ffd36e' : '#fff6dc', dur: 1300 });
          if (fire) {
            FX.flame($('chips-box'), true); FX.flame($('mult-box'), true); FX.embers($('handbox'), true);
            FX.shake(8, 450); BR.BG.pulse(1);
            FX.burst(pc[0], pc[1], { n: 40, colors: ['#ffd36e', '#ff8a3d', '#fff'], speed: 9, life: 900, size: 4, shape: 'star' });
          }
          await wait(500);
          await countScore(startScore, g.r.score);
          await wait(fire ? 650 : 350);
          FX.flame($('chips-box'), false); FX.flame($('mult-box'), false); FX.embers(null, false);
          tEl.classList.remove('show');
          break;
        }
      }
      if (st.post) await wait(60);
    }
    ach({ type: 'hand', total: res.total, cante: res.ctx && res.ctx.cante, contains: res.ev.contains, handType: res.ev.type });
    const nb = Meta.recordHand(g, res.total, res.ev.type);
    if (nb && res.total > 1000) S.toast('✦ ¡Nueva mejor mano: ' + BR.fmt(res.total) + '!', 'unlock');
    UI.animScore = false;
    UI.scoring = null;
  }
  function countScore(a, b) {
    return new Promise((resolve) => {
      const g = UI.g;
      const t0 = performance.now(), dur = 650 / BR.speedMult;
      const el = $('round-score'), fill = $('score-fill');
      const step = (now) => {
        const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        const v = a + (b - a) * e;
        el.textContent = BR.fmt(v); el._h = null;
        fill.style.width = Math.min(100, (v / g.r.target) * 100) + '%';
        if (k < 1) requestAnimationFrame(step); else { $('scorebox').classList.toggle('done', b >= g.r.target); resolve(); }
      };
      requestAnimationFrame(step);
      flashEl('round-score');
    });
  }

  async function finishPlay(res) {
    const g = UI.g;
    const playedIds = g.played.slice();
    const out = g.finishPlay();
    const sr = $('stage').getBoundingClientRect();
    for (const c of out.broken) { V.exit(c.id, { mode: 'shatter' }); }
    if (out.broken.length) { AU.sfx.glass(); FX.shake(5, 250); for (const c of out.broken) { const p = V.center(c.id); if (p) FX.burst(p[0], p[1], { n: 26, colors: ['#e8fbff', '#9fe0ff', '#fff'], speed: 7, life: 700, size: 3, shape: 'rect' }); } }
    if (out.glassEv) showEvents(out.glassEv);
    for (const id of playedIds) if (!out.broken.some((c) => c.id === id)) V.exit(id, { mode: 'fly', x: sr.width + UI.cw, y: sr.height * 0.4, rot: 40 });
    for (const id of out.discarded || []) V.exit(id, { mode: 'fly', x: sr.width + UI.cw, y: sr.height * 0.7, rot: 40 });
    $('hand-name').innerHTML = '&nbsp;'; setChipsMult(0, 0);
    if (out.won) {
      // las cartas que quedan vuelven al mazo
      render();
      await wait(400);
      await roundWon(out);
      return;
    }
    if (out.lost) { render(); await wait(500); gameOver(out.empty ? 'Te has quedado sin cartas' : null); return; }
    const order = out.drawn.slice();
    UI.dealDelay = (id) => { const i = order.indexOf(id); return i >= 0 ? 200 + i * 70 : 0; };
    render();
    UI.dealDelay = null;
    order.forEach((_, i) => setTimeout(() => AU.sfx.deal(), (200 + i * 70) / BR.speedMult));
    await wait(300 + order.length * 70);
    UI.busy = false;
    render();
    save();
  }

  async function discard() {
    const g = UI.g;
    if (UI.busy || g.phase !== 'round' || !UI.sel.length || g.r.discardsLeft <= 0) return;
    clearSelections();
    UI.busy = true;
    const ids = UI.sel.slice();
    const sr = $('stage').getBoundingClientRect();
    ids.forEach((id, i) => V.exit(id, { mode: 'fly', x: sr.width + UI.cw, y: sr.height * 0.55 + i * 10, rot: 50 + i * 8 }));
    const res = g.discard(ids);
    UI.sel = [];
    AU.sfx.whoosh();
    showEvents(res.ev);
    if (res.created.length) { AU.sfx.levelup(); S.toast('✦ El Lacre del Augur te concede un Augurio', 'unlock'); }
    const order = res.drawn.slice();
    UI.dealDelay = (id) => { const i = order.indexOf(id); return i >= 0 ? 150 + i * 70 : 0; };
    render();
    UI.dealDelay = null;
    order.forEach((_, i) => setTimeout(() => AU.sfx.deal(), (150 + i * 70) / BR.speedMult));
    await wait(250 + order.length * 70);
    UI.busy = false;
    if (res.lost) { gameOver('Te has quedado sin cartas'); return; }
    render(); save();
  }

  function showEvents(evs) {
    if (!evs) return;
    let k = 0;
    for (const e of evs) {
      if (!e.msg && !e.money) continue;
      setTimeout(() => {
        const p = V.center(e.uid); if (!p) return;
        V.jig(e.uid);
        if (e.money) { FX.pop(p[0], p[1] + UI.ch * 0.4, '+$' + e.money, 'money'); AU.sfx.money(); }
        else { FX.pop(p[0], p[1] + UI.ch * 0.4, e.msg, 'msg', { color: e.color === 'm' ? '#ff8090' : e.color === 'c' ? '#8fc0ff' : e.color === 'x' ? '#ff9ad0' : null }); AU.sfx.tick(); }
      }, (k++ * 280) / BR.speedMult);
    }
  }

  /* ======================= fin de ronda / cobro ======================= */
  async function roundWon(out) {
    const g = UI.g;
    const boss = g.r.kind === 'boss';
    AU.sfx.win();
    banner(out.fenix ? '¡El Fénix te salva!' : boss ? '¡Guardián vencido!' : '¡Envite superado!', '', out.fenix ? 'Arde en llamas y renace tu esperanza' : null);
    FX.confetti();
    BR.BG.pulse(1.2);
    ach({ type: 'round', boss: g.r.kind === 'boss' });
    await wait(900);
    for (const id of g.hand) V.exit(id, { mode: 'fly', x: deckPos().x, y: deckPos().y, down: true });
    const res = g.endRound();
    showEvents(res.tev.filter((e) => !e.money));
    if (res.created.length) S.toast('✦ Has recibido ' + res.created.length + ' consumible' + (res.created.length > 1 ? 's' : ''), 'unlock');
    const un = Meta.checkUnlocks(g);
    for (const u of un) S.toast('🔓 ' + u.text, 'unlock');
    UI.busy = false;
    render();
    buildCashout();
    save();
  }
  function buildCashout() {
    const g = UI.g;
    const el = $('cashout');
    const lines = g.cashLines || [];
    el.innerHTML = `<div class="cashcard panel"><h2>¡A cobrar!</h2><div class="sub">Noche ${g.ante} · ${g.blindKind() === 'boss' ? BR.BOSS_BY_ID[g.bossId].name : BR.RIVALS[g.blindKind()].name}</div>
      ${lines.map((l) => `<div class="cashline"><span>${l.label}</span><span class="v">${l.value ? '$'.repeat(Math.min(l.value, 8)) + (l.value > 8 ? '…' : '') + ' ' + l.value : '0'}</span></div>`).join('')}

    const ls = el.querySelectorAll('.cashline');
